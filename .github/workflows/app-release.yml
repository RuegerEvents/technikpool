name: Release scanner app

# Tags in this monorepo are namespaced by what they release:
#   v1.2.3          → the server, built and pushed by docker-publish.yml
#   scanner-v1.2.3  → the Flutter app, built and uploaded here
# The two globs are mutually exclusive, so a server release never builds an app
# and vice versa. `pnpm release` and `pnpm release:app` are what create them.
on:
  push:
    tags:
      - 'scanner-v[0-9]*'
  # Re-running an upload without re-tagging — a store rejected the binary, a
  # credential was wrong — shouldn't need a fake version bump.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag to build (defaults to the current branch)'
        required: false
        type: string

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.1'

jobs:
  # Each store is enabled by a repository *variable*, not by whether its secrets
  # happen to be set: a release that silently skipped a store would look exactly
  # like one that succeeded. Set RELEASE_ANDROID / RELEASE_IOS to 'true' under
  # Settings › Secrets and variables › Actions › Variables once that store's
  # credentials are in place.
  android:
    if: vars.RELEASE_ANDROID == 'true'
    runs-on: ubuntu-latest
    # Only this job writes anything back: the APK goes on the GitHub release
    # for devices that can't reach Play, so it needs to create that release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/scanner/android

      # The upload key and the Play credentials only exist for the length of
      # this job, and both are cleaned up below even if the upload fails.
      - name: Write signing credentials
        working-directory: apps/scanner/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD PLAY_JSON_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret ANDROID_$name (or GOOGLE_PLAY_JSON_KEY) is not set" >&2
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > upload.jks
          printf '%s\n' "$PLAY_JSON_KEY" > play-store-key.json
          cat > key.properties <<EOF
          storeFile=$PWD/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Publish to production
        working-directory: apps/scanner/android
        run: bundle exec fastlane production

      # The same build also goes on the GitHub release as a plain APK, for a
      # handheld with no Play Store (most warehouse PDAs) or an install without
      # a Google account. It is signed with the upload key, so it updates
      # itself release over release — but not a copy installed from Play,
      # which Google re-signs with its own key. Pick one channel per device.
      - name: Build the APK
        working-directory: apps/scanner/android
        run: bundle exec fastlane apk

      - name: Shred credentials
        if: always()
        working-directory: apps/scanner/android
        run: rm -f upload.jks play-store-key.json key.properties

      # A dispatch from a branch has no tag to hang a release on, so it stops
      # here with the APK in the log; a dispatch that names a scanner-v* tag
      # re-uploads, replacing the asset — the `build` re-cut moves the tag
      # and this is what puts the new binary on it.
      - name: Publish the APK on the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          tag="${REF#refs/tags/}"
          case "$tag" in
            scanner-v[0-9]*) ;;
            *) echo "::notice::$tag is not a scanner-v* tag, so no release is published"; exit 0 ;;
          esac
          version="${tag#scanner-v}"
          apk="apps/scanner/build/app/outputs/flutter-apk/app-release.apk"
          asset="technikpool-scanner-$version.apk"
          cp "$apk" "$asset"

          # The release notes are the changelog entry, which pnpm release:app
          # has already checked is the first one and is this version.
          jq -r --arg v "$version" '
            .[0] | if .version != $v then error("changelog starts with \(.version), not \($v)") else . end
            | "## What'"'"'s new\n\n" + (.en | map("- " + .) | join("\n"))
            + "\n\n## Was ist neu\n\n" + (.de | map("- " + .) | join("\n"))
            + "\n\nSideload build for devices without Google Play. A copy installed from Play cannot update to this one, or the other way round; keep each device on one channel."
          ' apps/scanner/assets/changelog.json > release-notes.md

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
            gh release edit "$tag" --notes-file release-notes.md
          else
            gh release create "$tag" "$asset" --title "Scanner $version" --notes-file release-notes.md
          fi

  ios:
    if: vars.RELEASE_IOS == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/scanner/ios

      # The signing identity is not a secret here — it is cloned from the match
      # repo and decrypted at build time, so there is no .p12 to export, rotate
      # by hand, or keep in step across machines. The lane runs `setup_ci`,
      # which puts it in a throwaway keychain that dies with the runner.
      # A macOS runner starts with no known_hosts, so the first clone of the
      # certificates repo would stop on an interactive host-key prompt.
      - name: Trust github.com for ssh
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "$ASC_KEY_P8" ]; then
            echo "::error::Secret ASC_KEY_P8 is not set" >&2
            exit 1
          fi
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc_key.p8"

      - name: Upload and submit for review
        working-directory: apps/scanner/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc_key.p8
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          # A read-only deploy key on the certificates repo — not a PAT, which
          # would carry whatever else the issuing account can reach. match takes
          # the key's contents directly and loads it into an ssh-agent itself.
          MATCH_GIT_PRIVATE_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
        run: bundle exec fastlane release

      - name: Shred credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/asc_key.p8"
