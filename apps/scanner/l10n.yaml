# German is the language the warehouse works in and the language the web app
# defaults to, but English is the source: it is what the strings are authored
# in, mirroring the web, where en.po is the source catalogue and de.po the
# translation.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-dir: lib/l10n/generated
output-localization-file: app_localizations.dart
output-class: S
nullable-getter: false
