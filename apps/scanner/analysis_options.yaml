include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Regenerated from ../web/openapi.yaml — lint findings here are the
    # generator's to fix, not ours.
    - lib/api/generated/**
    - "**/*.g.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    prefer_single_quotes: true
