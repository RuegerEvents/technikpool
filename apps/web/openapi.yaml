openapi: 3.1.0

info:
  title: Technikpool API
  version: 1.0.0
  description: |
    Read and scan access to Technikpool inventory for external clients — chiefly
    the Flutter app running on warehouse PDA scanners — and maintenance of the
    shared catalog (products and categories) for scripts and assistants.

    This document is the contract. Server response types are generated from it
    (`pnpm openapi:types`) and so is the Dart client (`dart run swagger_parser`),
    so an endpoint that drifts from this file fails the build rather than the
    device.

    ## Authentication

    Every /api/v1 operation needs `Authorization: Bearer <session token>`.
    A token is obtained in one of two ways, both documented below:

    1. **Device authorization grant** (preferred for shared devices). POST
       /api/auth/device/code, show the returned `user_code` to the operator,
       and poll POST /api/auth/device/token until it stops answering
       `authorization_pending`. Meanwhile a signed-in user approves the code in
       a browser. Respect `interval`: polling faster earns `slow_down`.
    2. **Password sign-in.** POST /api/auth/sign-in/email. The token comes back
       in the `set-auth-token` *response header*, not the body.

    Reads are scoped to the organizations the authenticated user belongs to.
    System admins see everything.

servers:
  - url: /
    description: Same origin as the app

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Obtaining a session token. Not under /api/v1 — these are better-auth routes.
  - name: identity
    description: Who the caller is and what they can see.
  - name: inventory
    description: Reading locations, productions and assets.
  - name: scanning
    description: Booking scanned assets in and out.
  - name: stocktake
    description: |
      Counting what an organization actually has (Inventur). An open stocktake
      lists whatever its scope matches *right now* — a unit registered or moved
      into it appears, one retired or moved out disappears, and "checked out"
      is the status of the moment. Counters scan or tick units and enter counts
      for loose untagged ones; only those are stored. Closing freezes the list
      of that moment into the report. Nothing about an asset changes while a
      stocktake is open.
  - name: caseCheck
    description: |
      Checking one case (Kiste checken): a kit, or a unit with its
      accessories. The client fetches the case's contents once and ticks them
      off locally as it scans; nothing is stored until the check is recorded,
      which writes one `CASE_CHECKED` entry into the history of every unit in
      the case. Missing units are reported, never changed.
  - name: productionCheck
    description: |
      Checking a production's equipment against its list (Prüfen), as often
      as needed and by several people at once — ticks are stored and shared,
      and nothing about an asset changes. A check belongs to one side: the
      production's own org checks every unit on it, a lending org only its
      own units. Each side has at most one open check; starting one joins it.

      On the production's own side a check is also where lent units change
      hands: ticked units another org lent can be confirmed as received, and
      later reported as sent back. The lender's side of the handover is the
      ordinary scan — out to the production, then back onto a location.
  - name: bundles
    description: |
      Keeping kits (Bundles): finding them, making a new one, and changing
      what one holds — scanning units in, taking them out, adding a number of
      loose untagged units. Under the same rules as the web's bundle page: a
      unit is in one kit at a time, its accessories go with it, a kit's own
      location wins, and a bundle type already on the shelf takes only what
      it holds.
  - name: productionHandout
    description: |
      Handing a production's equipment out and taking it back by working
      through its list: scan a tag, tick a unit whose label was checked by
      eye, or count interchangeable units without a tag. Unlike a check, a
      tick here is the booking itself, so nothing is stored beyond the
      units' own status and everyone on the list sees the same ticks.
  - name: catalog
    description: |
      The product catalog, shared by every organization. Changing a product's
      identity (name, category, caption, details, licence) or whether it needs
      DGUV inspections answers to the same rule as on the web: a system admin,
      or an ADMIN/OWNER of every organization holding units of it — and, for a
      product nobody holds units of, whoever created it. Merging a product
      away needs that right over the duplicate. Categories, renaming or
      merging manufacturers, a connector's mains flag and the catalog log are
      system admin only. Every change is written to the catalog log, and a
      product update can be reverted from it.
  - name: inspection
    description: |
      Inspections of every type — electrical (DGUV V3), lifting equipment, a
      visual check, a tester's calibration; listInspectionTypes has the
      list. Recording an inspection, or deleting one recorded by mistake, is
      all a client ever does: a due date is never set. Per type, it follows
      from the unit's interval for that type and its latest inspection of that
      type — that plus the interval after a pass, that same day after a fail,
      and the day the unit was registered if it was never inspected. A unit
      without an interval for a type is not tracked for it and is never due.
      A failed inspection also sets the unit to its type's `failStatus`.
      Needs ADMIN or OWNER of the unit's organization.

      Everything from before inspection types is electrical, and so is an
      inspection recorded without a `typeId`, so an older client keeps
      working. `requiresInspection`, `inspectionRequired`,
      `inspectionIntervalMonths` and the like are the electrical type's.

paths:
  /api/auth/device/code:
    post:
      operationId: requestDeviceCode
      tags: [auth]
      summary: Start the device authorization flow
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCodeRequest'
      responses:
        '200':
          description: Device and user codes issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCodeResponse'
        '400':
          $ref: '#/components/responses/OAuthError'

  /api/auth/device/token:
    post:
      operationId: pollDeviceToken
      tags: [auth]
      summary: Exchange an approved device code for a session token
      description: |
        Poll no faster than the `interval` from the code response. Until the
        user approves, this answers 400 with `error: authorization_pending`;
        polling too fast answers `slow_down`; an expired code answers
        `expired_token`; a denied one `access_denied`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTokenRequest'
      responses:
        '200':
          description: Session token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTokenResponse'
        '400':
          $ref: '#/components/responses/OAuthError'

  /api/auth/device/approve:
    post:
      operationId: approveDeviceCode
      tags: [auth]
      summary: Approve a pending device code (browser, signed in)
      description: |
        Requires a signed-in session cookie, and the session must already have
        claimed the code via `GET /api/auth/device?user_code=...`. Used by the
        web UI, not by the device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userCode]
              properties:
                userCode:
                  type: string
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          $ref: '#/components/responses/OAuthError'

  /api/auth/sign-in/email:
    post:
      operationId: signInWithEmail
      tags: [auth]
      summary: Sign in with email and password
      description: |
        The session token is returned in the `set-auth-token` response header.
        Native clients must read it from there.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Signed in
          headers:
            set-auth-token:
              description: The session token to use as a bearer credential.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/me:
    get:
      operationId: getCurrentUser
      tags: [identity]
      summary: The authenticated user and their organizations
      description: |
        Also the cheapest way for a client to check whether its stored token is
        still valid — a 401 here means unpair and sign in again.
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/legal:
    get:
      operationId: listLegalLinks
      tags: [identity]
      summary: The server operator's imprint, privacy policy and terms
      description: |
        Whatever the operator has set up, in the order imprint, privacy, terms;
        a page they haven't set up is left out, so the list may be empty. Each
        `url` is absolute and opens in a browser: either the operator's own site
        or a page on this server. Needs no token, like the pages themselves.
      security: []
      responses:
        '200':
          description: Configured legal pages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LegalLink'

  /api/v1/cable-colors:
    get:
      operationId: listCableColors
      tags: [inventory]
      summary: The cable colour codes the user's equipment is marked with
      description: |
        One scheme per organization: the colour of tape that marks each cable
        length. Every organization the user belongs to, plus every organization
        that has a unit on one of their productions — a lent cable carries its
        owner's colour. An organization without bands is left out.

        A unit's colour is the band of its owner's scheme with the smallest
        `maxLengthCm` that is at least the product's `cable.lengthCm`; a longer
        cable, or a product without a length, has none.
      responses:
        '200':
          description: The schemes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CableColorScheme'

  /api/v1/locations:
    get:
      operationId: listLocations
      tags: [inventory]
      summary: Locations a unit can be put at
      description: |
        Every location of the user's organizations — any role, DEVICE_VIEWER included —
        plus any other location already holding active units of those organizations.
        A unit may be scanned onto a location of another organization the user belongs
        to (a friend storing the equipment); that organization does not see it.
      responses:
        '200':
          description: Locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/productions:
    get:
      operationId: listProductions
      tags: [inventory]
      summary: Productions across the user's organizations
      description: |
        Cancelled productions are left out: nothing can be checked out to one,
        so it is never a scan target. Units still out on a cancelled production
        come back by scanning them onto a location, as always.

        Includes other orgs' productions that the caller's orgs lend units to.
        `checkoutRole` says what a scan to each may do, `canCheck` whether the
        caller may check it.
      responses:
        '200':
          description: Productions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Production'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/categories:
    get:
      operationId: listCategories
      tags: [inventory]
      summary: Product categories
      description: |
        Global rather than per-organization: a category is a kind of equipment,
        and two orgs lending each other a moving light agree on what it is.
      responses:
        '200':
          description: Categories, already in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/categories/{categoryId}:
    patch:
      operationId: updateCategory
      tags: [catalog]
      summary: Change a category
      description: |
        System admins only. Fields left out are left alone. Switching an
        inspection type (`inspections`, or `requiresInspection` for the
        electrical one) moves the inspection interval of every unit whose
        product follows its category for that type: units that now need it get
        their organization's interval, units that no longer do lose theirs.
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdateRequest'
      responses:
        '200':
          description: The category as it is now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryUpdated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/connectors:
    get:
      operationId: listConnectors
      tags: [catalog]
      summary: Connectors in the catalog
      description: |
        Every connector a cable end or a device panel can name, by the
        spelling the catalog files it under. Use these names in a product's
        `cable` and `ports`; a name is matched without case.
      responses:
        '200':
          description: Connectors, by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Connector'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createConnector
      tags: [catalog]
      summary: Register a connector
      description: |
        Returns the connector of that name if the catalog has one (ignoring
        case), else registers it, so a panel can name it. Its family is the
        name's first word unless given, and it carries mains voltage when that
        family already does. Needs ADMIN or OWNER of an organization, as on
        the web.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorCreateRequest'
      responses:
        '200':
          description: The connector
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connector'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/products:
    get:
      operationId: listProducts
      tags: [catalog]
      summary: Browse the product catalog
      description: |
        The whole catalog, since it is shared, ordered by name. The unit counts
        are of the caller's organizations only (every organization for a
        system admin), and so are the `tracked` and `overdue` filters.
      parameters:
        - name: q
          in: query
          description: Case-insensitive match on product name, caption or manufacturer name.
          schema:
            type: string
        - name: categoryId
          in: query
          schema:
            type: string
        - name: inspectionRequired
          in: query
          description: Only products whose units do (`true`) or do not (`false`) need the inspection type `inspectionTypeId`, after the category default.
          schema:
            type: boolean
        - name: inspectionTypeId
          in: query
          description: The type `inspectionRequired` asks about. Absent - electrical.
          schema:
            type: string
        - name: mains
          in: query
          description: Only products with (`true`) or without (`false`) a connector that carries mains voltage.
          schema:
            type: boolean
        - name: tracked
          in: query
          description: >-
            Only products with (`true`) or without (`false`) active units that
            carry an inspection interval. `inspectionRequired=false&tracked=true`
            finds units still tracked although their product says they need not be.
          schema:
            type: boolean
        - name: overdue
          in: query
          description: Only products with at least one active unit whose inspection is due today or earlier.
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: The `nextCursor` from a previous page.
          schema:
            type: string
      responses:
        '200':
          description: A page of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      operationId: createProduct
      tags: [catalog]
      summary: Add a product to the catalog
      description: |
        For registering units of something the catalog does not know yet. One
        product per name and manufacturer, ignoring case and blanks — a name
        that is taken is `409` with the existing product's name in the
        message. The manufacturer is found by name or made. Takes ADMIN or
        above of `organizationId`, the org the units are for; the product
        itself is shared by every org, like all of the catalog, and answers
        to its creator until someone holds units of it. Pictures and cable
        ends are edited on the web.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '201':
          description: The new product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/products/{productId}:
    get:
      operationId: getProduct
      tags: [catalog]
      summary: One product of the catalog
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogProduct'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteProduct
      tags: [catalog]
      summary: Delete a product nobody holds units of
      description: |
        Only a product without units, retired ones included (`409` otherwise —
        merge it into the right product instead). Without units it answers to
        its creator or a system admin. Cannot be reverted.
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDeleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    patch:
      operationId: updateProduct
      tags: [catalog]
      summary: Change a product
      description: |
        Fields left out are left alone. `cable` and `ports` each replace the
        whole list they describe. A `ports` line naming a connector the catalog
        does not have is refused (`404 connector_not_found`) before anything is
        written; a cable end may name a new one, which is created and marked as
        carrying mains voltage when its family already is. The panel answers to
        a looser rule than the rest — a first panel is open to any MEMBER, as on
        the web — and is written after the other fields, so a refusal there
        leaves those applied. Changing `inspections` (or `requiresInspection`,
        the electrical type), the category or `isLicense` can change which
        inspections the product's units need, and moves their intervals accordingly — across every
        organization holding units of it, which is why the right to do so is
        the identity rule described under the `catalog` tag. A name another
        product of the same manufacturer already has is refused (`409`).
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
      responses:
        '200':
          description: The product as it is now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductUpdated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/products/{productId}/merge:
    post:
      operationId: mergeProduct
      tags: [catalog]
      summary: Merge a duplicate into this product
      description: |
        Every unit of `sourceProductId` — retired ones too — becomes a unit of
        this product, and the source row is deleted. This product keeps its
        name, manufacturer and category; it takes the source's picture, cable
        and panel only where it has none of its own, and an organization's
        price for the source moves over unless that organization priced this
        one itself. The moved units follow this product's inspection
        requirement. Offers and invoices already written keep naming the
        source. Needs the identity right over the *source* product. Cannot be
        reverted.
      parameters:
        - name: productId
          in: path
          required: true
          description: The product that remains.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductMergeRequest'
      responses:
        '200':
          description: Merged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductMerged'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/manufacturers:
    get:
      operationId: listManufacturers
      tags: [catalog]
      summary: Manufacturers in the catalog
      responses:
        '200':
          description: Manufacturers, by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Manufacturer'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createManufacturer
      tags: [catalog]
      summary: Find or register a manufacturer
      description: |
        Returns the manufacturer of that name if the catalog has one (ignoring
        case), else registers it. Open to anyone who works in an organization,
        as on the web.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManufacturerCreateRequest'
      responses:
        '200':
          description: The manufacturer, and whether it was created now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManufacturerCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/manufacturers/{manufacturerId}:
    patch:
      operationId: updateManufacturer
      tags: [catalog]
      summary: Rename a manufacturer
      description: System admins only. A name another manufacturer has is refused (`409`).
      parameters:
        - name: manufacturerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManufacturerUpdateRequest'
      responses:
        '200':
          description: The manufacturer as it is now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manufacturer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/manufacturers/{manufacturerId}/merge:
    post:
      operationId: mergeManufacturer
      tags: [catalog]
      summary: Merge a duplicate manufacturer into this one
      description: |
        System admins only. Every product of `sourceManufacturerId` moves to
        this manufacturer and the source is deleted. Refused (`409`) while both
        have a product of the same name — merge those products first.
      parameters:
        - name: manufacturerId
          in: path
          required: true
          description: The manufacturer that remains.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManufacturerMergeRequest'
      responses:
        '200':
          description: Merged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManufacturerMerged'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/connectors/{connector}:
    patch:
      operationId: updateConnector
      tags: [catalog]
      summary: Say whether a connector carries mains voltage
      description: |
        System admins only. Products are not re-flagged by this; a product with
        a mains connector that does not need inspecting shows up under
        `listProducts?mains=true&inspectionRequired=false`.
      parameters:
        - name: connector
          in: path
          required: true
          description: The connector's name, URL-encoded, matched without case.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorUpdateRequest'
      responses:
        '200':
          description: The connector as it is now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connector'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/catalog-log:
    get:
      operationId: listCatalogLog
      tags: [catalog]
      summary: The catalog log
      description: |
        Every change to a product, manufacturer or category, newest first.
        System admins only, since it spans every organization.
      parameters:
        - name: productId
          in: query
          description: Only entries about this product (merges name the product that remained).
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Entries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogLogEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/catalog-log/{entryId}/revert:
    post:
      operationId: revertCatalogChange
      tags: [catalog]
      summary: Undo a product change
      description: |
        System admins only. Puts back what one `PRODUCT_UPDATED` entry changed,
        field by field, and only where the product still holds the value that
        entry wrote. The revert is logged as a new entry with `revertOf`, so it
        can be undone the same way. Merges and deletions cannot be reverted
        (`409`), nor an entry every field of which has been changed again since.
      parameters:
        - name: entryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The product as it is now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductUpdated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/assets:
    get:
      operationId: listAssets
      tags: [inventory]
      summary: Browse assets
      description: |
        Sold and decommissioned assets are left out — this is the pool that can
        still be worked with. Look one up by tag to see a retired unit.
      parameters:
        - name: locationId
          in: query
          description: Only assets currently at this location.
          schema:
            type: string
        - name: productionId
          in: query
          description: >-
            Only assets booked to this production. Listing a production's kit is
            a read of that production, so a caller who may not open it is
            refused (`403`) rather than handed an empty page, and an id that
            names nothing answers `404 production_not_found`.
          schema:
            type: string
        - name: categoryId
          in: query
          description: Only assets whose product is in this category.
          schema:
            type: string
        - name: productId
          in: query
          description: Only units of this product.
          schema:
            type: string
        - name: q
          in: query
          description: Case-insensitive match on asset tag, serial number, product name or caption, or manufacturer name.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: The `nextCursor` from a previous page.
          schema:
            type: string
      responses:
        '200':
          description: A page of assets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createAsset
      tags: [inventory]
      summary: Register one unit of a product, with the tag just scanned
      description: |
        Takes ADMIN of the organization, like registering units on the web.
        The tag is required and is used as given — nothing is numbered for it:
        it has to start with the org's prefix (`asset_tag_prefix_mismatch`)
        and not be on another unit already (`asset_tag_in_use`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetCreateRequest'
      responses:
        '201':
          description: The unit was registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/assets/untagged:
    post:
      operationId: createUntaggedAssets
      tags: [inventory]
      summary: Register a number of units that carry no tag
      description: |
        For what nobody puts a sticker on — a drawer of cables. `count` units
        of one product, without tags. With `bundleId` they go straight into
        that kit, as on `createAsset`. ADMIN or above of the organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UntaggedAssetsRequest'
      responses:
        '201':
          description: The new units
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetCreateResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/assets/{assetId}:
    get:
      operationId: getAsset
      tags: [inventory]
      summary: One unit by its id, with recent history
      description: |
        The same answer as `GET /assets/by-tag/{tag}`, for a unit picked from
        a list — an untagged one has no tag to look it up by. Only units of
        the caller's organizations (any for a system admin).
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The asset, with recent history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/assets/{assetId}/tag:
    put:
      operationId: setAssetTag
      tags: [inventory]
      summary: Give an untagged unit the tag just scanned
      description: |
        Takes ADMIN of the unit's organization. Only for a unit without a tag:
        one that has one is refused (`asset_already_tagged`) — a second scan on
        the wrong row is likelier than a sticker that really changed, and the
        web is where a tag is corrected. Same checks on the tag as
        `createAsset`.
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetTagRequest'
      responses:
        '200':
          description: The unit now carries the tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/assets/by-tag/{tag}:
    get:
      operationId: getAssetByTag
      tags: [inventory]
      summary: Look up one asset by its printed tag or serial number
      description: |
        The asset tag is unique and always wins. Failing that the code is
        matched, case-insensitively, against serial numbers among the assets
        the caller can already see — and only resolves when exactly one unit
        carries it. Two units sharing a serial answer `409 serial_ambiguous`
        rather than guessing between them.
      parameters:
        - name: tag
          in: path
          required: true
          description: |
            The asset tag as encoded in the sticker's barcode, or a serial
            number that belongs to exactly one unit.
          schema:
            type: string
      responses:
        '200':
          description: The asset, with recent history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/scans:
    post:
      operationId: createScan
      tags: [scanning]
      summary: Book a scanned asset to a location or production
      description: |
        Assigning an asset to a location also returns it from any production it
        is currently checked out to — putting kit back on the shelf is what
        "returned" means in practice.

        `assetTag` also accepts a serial number, on the same terms as
        `getAssetByTag`: the printed tag wins, and a serial resolves only when
        exactly one visible unit carries it.

        A kit's number checked out to a production where another kit of its
        type is booked takes that kit's booking over (`kitSwap`). Refused with
        `409 kit_started` when everything booked of the type has begun to go
        out, and `409 kit_unavailable` when a unit of it is
        out or booked elsewhere for overlapping days. `params` of the error
        are the booked kit's and the scanned kit's names.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanRequest'
      responses:
        '200':
          description: The asset was booked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/scans/batch:
    post:
      operationId: createScanBatch
      tags: [scanning]
      summary: Book several units to a location or production at once
      description: |
        What follows a scan's `group`: the units picked from it, booked to the
        same target the scan went to. Each unit takes its accessories along, as
        a scan does. A kit's own location only moves when all of it is in the
        batch. A batch to a production holding a whole kit may take over the
        booking of the booked kit of its type, as a scan of the kit's number
        does (`kitSwaps`, and the same `409 kit_*` refusals).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanBatchRequest'
      responses:
        '200':
          description: The units were booked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanBatchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/stocktakes:
    get:
      operationId: listStocktakes
      tags: [stocktake]
      summary: Stocktakes of the caller's organizations
      parameters:
        - name: status
          in: query
          description: Only open or only closed ones. Both when omitted.
          schema:
            $ref: '#/components/schemas/StocktakeStatus'
      responses:
        '200':
          description: Newest first, open ones before closed ones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StocktakeSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createStocktake
      tags: [stocktake]
      summary: Start a stocktake
      description: |
        Stores the scope; the list is resolved whenever it is read. Needs MEMBER of the organization.
        A scope that matches nothing is refused with `409 stocktake_empty`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StocktakeCreateRequest'
      responses:
        '200':
          description: The new stocktake
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StocktakeSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/stocktakes/preview:
    post:
      operationId: previewStocktake
      tags: [stocktake]
      summary: What a stocktake with this scope would contain
      description: |
        Nothing is stored. `overlaps` lists open stocktakes that already count
        some of the same units — allowed, but worth a warning before starting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StocktakeScopeRequest'
      responses:
        '200':
          description: The size of the list right now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StocktakePreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/stocktakes/{stocktakeId}:
    get:
      operationId: getStocktake
      tags: [stocktake]
      summary: A stocktake with every unit and product count
      parameters:
        - $ref: '#/components/parameters/StocktakeId'
      responses:
        '200':
          description: The stocktake
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StocktakeDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/stocktakes/{stocktakeId}/scans:
    post:
      operationId: scanIntoStocktake
      tags: [stocktake]
      summary: Count one scanned code
      parameters:
        - $ref: '#/components/parameters/StocktakeId'
      description: |
        An asset tag — or a serial number that belongs to exactly one unit —
        ticks that unit (`found`, or `unexpected` when it is not on the list)
        and returns its accessories in `confirm`, for the operator to confirm
        or uncheck; confirming goes through `tickStocktakeItems` with
        `via: parent`. A unit someone already counted answers `already` and
        changes nothing.

        A bundle tag ticks nothing and answers `bundle` with the members in
        `confirm` (`via: bundle` to tick them): opening the case is the point
        of a stocktake.

        `confirm` entries with a `foundByName` were counted already and should
        be shown as such rather than offered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StocktakeScanRequest'
      responses:
        '200':
          description: What the code turned out to be
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StocktakeScanResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/stocktakes/{stocktakeId}/ticks:
    post:
      operationId: tickStocktakeItems
      tags: [stocktake]
      summary: Tick units by hand, or confirm accessories / bundle members
      parameters:
        - $ref: '#/components/parameters/StocktakeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StocktakeTickRequest'
      responses:
        '200':
          description: How many were ticked, and how many someone had counted already
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StocktakeTickResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/stocktakes/{stocktakeId}/items/{assetId}:
    delete:
      operationId: untickStocktakeItem
      tags: [stocktake]
      summary: Take back one's own tick
      parameters:
        - $ref: '#/components/parameters/StocktakeId'
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      description: |
        Only whoever counted a unit can untick it (`403 stocktake_not_your_tick`).
        An unexpected unit leaves the list altogether.
      responses:
        '204':
          description: Unticked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    put:
      operationId: setStocktakeItemNote
      tags: [stocktake]
      summary: Note on a unit one counted, and whether it needs attention
      parameters:
        - $ref: '#/components/parameters/StocktakeId'
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StocktakeNoteRequest'
      responses:
        '204':
          description: Saved
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/stocktakes/{stocktakeId}/counts:
    put:
      operationId: setStocktakeCount
      tags: [stocktake]
      summary: The caller's count of a loose product at a location
      parameters:
        - $ref: '#/components/parameters/StocktakeId'
      description: |
        Counts are kept per counter and location and summed, so two people
        counting in two rooms add up. Setting one replaces the caller's own
        previous count there; zero is a count.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StocktakeCountRequest'
      responses:
        '204':
          description: Saved
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/stocktakes/{stocktakeId}/close:
    post:
      operationId: closeStocktake
      tags: [stocktake]
      summary: Close a stocktake
      parameters:
        - $ref: '#/components/parameters/StocktakeId'
      description: |
        Final: units still open become missing, and each unit's history gets an
        entry. Corrections (marking missing units unavailable, moving found
        ones) are applied afterwards on the web report.
      responses:
        '200':
          description: The closed stocktake
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StocktakeSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/case-checks/by-code/{code}:
    get:
      operationId: getCaseCheckByCode
      tags: [caseCheck]
      summary: Open the case a scanned code belongs to
      description: |
        A bundle tag opens its kit. A unit's tag or unique serial number opens
        the kit the unit is in; failing that, the unit it is an accessory of,
        or the unit itself when it has accessories. `scannedAssetId` is the
        unit the code was on, which the client counts as found. A unit that
        is none of these answers `409 not_a_case`.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The case and what it should hold
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseCheck'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/case-checks:
    post:
      operationId: recordCaseCheck
      tags: [caseCheck]
      summary: Record a finished case check
      description: |
        Judges the case as it is now against `foundAssetIds` — ids not in the
        case are ignored — and writes the outcome into every unit's history.
        Needs MEMBER or above of the org that owns the case (`canRecord`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseCheckRequest'
      responses:
        '200':
          description: How the check came out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseCheckResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/case-checks/{kind}/{id}/scans:
    post:
      operationId: scanCaseCheck
      tags: [caseCheck]
      summary: A code scanned into a case that is not on its list
      description: |
        Ticking happens on the client; this is for a code it does not find
        on the case's list. A unit of the same product and organization as
        one the case still lacks — not in `foundAssetIds`, not out on another
        job — takes that one's place: the two swap (see `ScanSwap`), the
        answer is `swapped` with the case as it is now, and the client ticks
        `assetId`. Only for whoever may record the check (`canRecord`), and
        never for a product marked `notInterchangeable`. A unit already on the
        list answers `found`; anything else `foreign`, with its name where the
        caller may see it.
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CaseKind'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseCheckScanRequest'
      responses:
        '200':
          description: What the code turned out to be
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseCheckScanResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/case-checks/{kind}/{id}/label:
    get:
      operationId: getCaseLabel
      tags: [caseCheck]
      summary: A case's label as ZPL, for a thermal label printer
      description: |
        The label for the outside of a case (Kistenetikett): the org's logo or
        name, the case's name, a DataMatrix of its tag, and — on the large
        label — what it holds, identical units as one line, continued on
        further labels when it is long. Rendered for a
        203 dpi printer speaking ZPL (a Honeywell PC42E-T in ZSim mode). The
        client sends `zpl` unchanged to the printer's raw port, usually 9100;
        the server never talks to a printer.

        `large` is a 4×6″ shipping label, `small` an 80×55 mm one with no
        contents list. A kit's code is its own tag, else the tag of its case
        (the container unit in it, `BundleDetail.caseUnitId`); a case with
        neither prints without a code. Anyone who
        sees the equipment may print one.
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CaseKind'
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: size
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CaseLabelSize'
      responses:
        '200':
          description: The label, ready to send
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseLabel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/productions/{productionId}/checks:
    post:
      operationId: startProductionCheck
      tags: [productionCheck]
      summary: Start a check of a production, or join the open one
      description: |
        Without `organizationId` the caller checks as the production's own org
        when they may, else as the first org of theirs that lends to it.
      parameters:
        - $ref: '#/components/parameters/ProductionId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductionCheckStartRequest'
      responses:
        '200':
          description: The open check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionCheck'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/production-checks/{checkId}:
    get:
      operationId: getProductionCheck
      tags: [productionCheck]
      summary: A check with its list and who ticked what
      parameters:
        - $ref: '#/components/parameters/CheckId'
      responses:
        '200':
          description: The check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionCheck'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/production-checks/{checkId}/scans:
    post:
      operationId: scanIntoProductionCheck
      tags: [productionCheck]
      summary: Tick one scanned code
      description: |
        An asset tag — or a serial number that belongs to exactly one unit —
        ticks that unit (`ticked`), along with its accessories that carry no
        tag of their own. A unit already ticked answers `already`; one that is
        not on the list is recorded as `unexpected`.
      parameters:
        - $ref: '#/components/parameters/CheckId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductionCheckScanRequest'
      responses:
        '200':
          description: What the code turned out to be
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionCheckScanResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/production-checks/{checkId}/ticks:
    post:
      operationId: tickProductionCheckItems
      tags: [productionCheck]
      summary: Tick units by hand
      description: Ids not on the list are ignored.
      parameters:
        - $ref: '#/components/parameters/CheckId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductionCheckTickRequest'
      responses:
        '200':
          description: How many were ticked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionCheckTickResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/production-checks/{checkId}/ticks/{assetId}:
    delete:
      operationId: untickProductionCheckItem
      tags: [productionCheck]
      summary: Take back one's own tick
      description: Only whoever ticked a unit can untick it (`403 tick_not_yours`).
      parameters:
        - $ref: '#/components/parameters/CheckId'
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Unticked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/production-checks/{checkId}/close:
    post:
      operationId: closeProductionCheck
      tags: [productionCheck]
      summary: Finish a check
      description: |
        Writes one `PRODUCTION_CHECKED` entry into the history of every unit on
        the list, found or missing, and closes the check. The next check starts
        with nothing ticked.
      parameters:
        - $ref: '#/components/parameters/CheckId'
      responses:
        '200':
          description: How the check came out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionCheckCloseResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/production-checks/{checkId}/receipt:
    post:
      operationId: confirmProductionCheckReceipt
      tags: [productionCheck]
      summary: Confirm receiving the ticked lent units
      description: |
        For the ticked units other orgs lent that are checked out to the
        production and not yet confirmed. Only the production's own org
        (MEMBER or above) or its crew (`403 receipt_forbidden`).
      parameters:
        - $ref: '#/components/parameters/CheckId'
      responses:
        '200':
          description: How many units were confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoverResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/production-checks/{checkId}/return-report:
    post:
      operationId: reportProductionCheckReturn
      tags: [productionCheck]
      summary: Report the ticked lent units as sent back
      description: |
        For ticked lent units whose receipt was confirmed. Tells the lender
        they are on their way; the lender scanning them onto a location is
        what returns them. Same rights as `receipt`.
      parameters:
        - $ref: '#/components/parameters/CheckId'
      responses:
        '200':
          description: How many units were reported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoverResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/production-checks/{checkId}/lines:
    put:
      operationId: setProductionCheckLine
      tags: [productionCheck]
      summary: Set how many units of a counted line are ticked
      description: |
        For a line of `lines` — interchangeable units without a tag. Raising
        the count ticks the next units as the caller's; lowering it takes back
        only the caller's own ticks, never below the line's `floor`. A count
        out of range is clamped, not refused.
      parameters:
        - $ref: '#/components/parameters/CheckId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductionListLineCount'
      responses:
        '200':
          description: The line's count afterwards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionListLineResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/productions/{productionId}/handout/{mode}:
    get:
      operationId: getProductionHandout
      tags: [productionHandout]
      summary: The list to hand a production's equipment out or take it back
      description: |
        The same list a check works through, but a tick is the booking itself.
        `checkout`: what is booked (APPROVED) or out (CHECKED_OUT), done when
        out. `checkin`: all of that and what is back (RETURNED), done when
        back — a unit booked but never handed out is taken back too, which
        books its checkout first. Lists
        only the units of the caller's orgs (MEMBER or above) — lent units are
        handed over by their lender and only counted in `othersCount`.
      parameters:
        - $ref: '#/components/parameters/ProductionId'
        - $ref: '#/components/parameters/HandoutMode'
        - name: organizationId
          in: query
          required: false
          description: |
            The side to see the list from — one of `sides`. A lending org's
            side lists only its units, by location: what it has to pack.
            Without it, the production's own side when the caller stands on
            it, else their first lending org.
          schema:
            type: string
      responses:
        '200':
          description: The list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionHandout'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/productions/{productionId}/handout/{mode}/scans:
    post:
      operationId: scanIntoProductionHandout
      tags: [productionHandout]
      summary: Book one scanned code
      description: |
        `checkout` books it out to the production, exactly like a scan with
        the production as the target. `checkin` puts it back onto the location
        it is kept on, which returns it from the production; one booked here
        and never handed out is checked out first. A unit from elsewhere is
        still put back — `returnedFrom` without this production says so.
        A kit's number handed out in the place of the booked kit of its type
        takes that kit's booking over, as `createScan` describes (`kitSwap`,
        `409 kit_*`). Never taking back.
      parameters:
        - $ref: '#/components/parameters/ProductionId'
        - $ref: '#/components/parameters/HandoutMode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandoutScanRequest'
      responses:
        '200':
          description: What was booked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/productions/{productionId}/handout/{mode}/ticks:
    post:
      operationId: tickProductionHandout
      tags: [productionHandout]
      summary: Tick or untick units by hand
      description: |
        `done: true` books them (out, or back onto their own location);
        `done: false` undoes that (back to booked, or out again). Accessories
        come along with the unit they hang off.
      parameters:
        - $ref: '#/components/parameters/ProductionId'
        - $ref: '#/components/parameters/HandoutMode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductionHandoutTickRequest'
      responses:
        '200':
          description: How many units were booked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoverResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/productions/{productionId}/handout/{mode}/lines:
    put:
      operationId: setProductionHandoutLine
      tags: [productionHandout]
      summary: Set how many units of a counted line are done
      description: |
        Books the difference: raising the count books the next units of the
        line, lowering it undoes the last ones. Clamped to the line.
      parameters:
        - $ref: '#/components/parameters/ProductionId'
        - $ref: '#/components/parameters/HandoutMode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductionListLineCount'
      responses:
        '200':
          description: The line's count afterwards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionListLineResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/productions/{productionId}/packing:
    post:
      operationId: packIntoProductionCase
      tags: [productionHandout]
      summary: Put units into a pack case, or take them out
      description: |
        A pack case is a unit whose product is a container
        (`CatalogProduct.isContainer`) and that is in no bundle. During one
        production it holds what is packed into it — units, part of a counted
        line, whole kits and other cases, nested as deep as need be but never
        in a circle. Opening a case is up to the client; a scan carries the
        open one (`HandoutScanRequest.packInto`), and this puts units in by
        hand. Packing is handing out: what goes in, and the case, is checked
        out if it was not. Units of the caller's side only. Taking a unit back
        empties it out of its case, so a case is empty once all is back.
        `409 not_a_pack_case` for anything not a case booked here, `409
        pack_circle` for a case into itself or into what it holds.
      parameters:
        - $ref: '#/components/parameters/ProductionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackRequest'
      responses:
        '200':
          description: How many units were moved, accessories included
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoverResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/productions/{productionId}/packing/{caseAssetId}/label:
    get:
      operationId: getPackCaseLabel
      tags: [productionHandout]
      summary: A pack case's label for this production, as ZPL
      description: |
        Like a case's label (`getCaseLabel`), for a pack case on one
        production: "Kiste 3" large, the production and the case's product
        under it, a DataMatrix of the case's tag, and — on the large label —
        what is in it now, a case or kit inside as one line. German, like the
        PDFs.
      parameters:
        - $ref: '#/components/parameters/ProductionId'
        - name: caseAssetId
          in: path
          required: true
          schema:
            type: string
        - name: size
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CaseLabelSize'
      responses:
        '200':
          description: The label, ready to send
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseLabel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/inspection-types:
    get:
      operationId: listInspectionTypes
      tags: [inspection]
      summary: Inspection types
      description: Shared by every organization and kept by system admins, like categories.
      responses:
        '200':
          description: Inspection types, already in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InspectionType'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/inspections:
    post:
      operationId: recordInspection
      tags: [inspection]
      summary: Record an inspection of a scanned unit
      description: |
        `code` is resolved like `getAssetByTag`: the printed tag wins, and a
        serial number only when exactly one visible unit carries it. A sold
        or decommissioned unit is not inspected (`409 asset_retired`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectionRequest'
      responses:
        '201':
          description: The inspection was recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionRecorded'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/defects:
    post:
      operationId: reportDefect
      tags: [inspection]
      summary: Report a defect on a scanned unit
      description: |
        What taking a unit back offers besides booking it: a failed visual
        check with what is wrong, which sets the unit to the visual type's
        `failStatus` (in maintenance). Needs MEMBER or more of the unit's
        organization, like taking it back. Booking a unit back without one
        records a passed visual check where its product needs one.
        `code` is resolved like `getAssetByTag`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefectRequest'
      responses:
        '201':
          description: The defect was recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefectReported'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/inspections/{inspectionId}:
    delete:
      operationId: deleteInspection
      tags: [inspection]
      summary: Delete an inspection recorded by mistake
      description: |
        The unit's next due date is derived again from what is left. A
        `BROKEN` status the inspection set stays.
      parameters:
        - name: inspectionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionDeleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/productions/{productionId}/handout/checkout/additions:
    get:
      operationId: searchProductionHandoutAdditions
      tags: [productionHandout]
      summary: Find units the hand-out list does not have, by name
      description: |
        For what was never booked and has nothing to scan: a cable without a
        tag. Units of the caller's side whose product matches `q` by the same
        rules as every search box (words in any order, lengths written either
        way, cable ends included), free for the production's dates, grouped by
        product, shelf and owner. Empty when the caller may not add to the
        production from that side, or `q` is shorter than two characters.
      parameters:
        - $ref: '#/components/parameters/ProductionId'
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: organizationId
          in: query
          required: false
          description: The side, as on the hand-out list.
          schema:
            type: string
      responses:
        '200':
          description: Up to 40 groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HandoutAddition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: handOutProductionAdditions
      tags: [productionHandout]
      summary: Hand out a number of one search result
      description: |
        Hands out up to `count` units of one group, untagged first. Someone
        may have taken some meanwhile: `count` in the answer is how many went.
      parameters:
        - $ref: '#/components/parameters/ProductionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandoutAdditionRequest'
      responses:
        '200':
          description: How many went out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/bundles:
    get:
      operationId: listBundles
      tags: [bundles]
      summary: The kits of the caller's organizations
      parameters:
        - name: organizationId
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: Matches the kit's name, caption and tag, or anything in it.
          schema:
            type: string
      responses:
        '200':
          description: By name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BundleSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createBundle
      tags: [bundles]
      summary: Make a new kit, and a bundle type for it
      description: |
        A new bundle type of this name with its one case, empty, to be filled
        by scanning. ADMIN or above of the organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BundleCreateRequest'
      responses:
        '201':
          description: The new kit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BundleDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/bundles/{bundleId}:
    get:
      operationId: getBundle
      tags: [bundles]
      summary: One kit with everything in it
      parameters:
        - $ref: '#/components/parameters/BundleId'
      responses:
        '200':
          description: The kit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BundleDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/bundles/{bundleId}/scans:
    post:
      operationId: scanIntoBundle
      tags: [bundles]
      summary: Put a scanned unit, or another kit, into the kit
      description: |
        A unit's tag or unique serial number puts the unit in; an accessory's
        puts in the unit it hangs off. Another bundle's tag puts that bundle
        inside this one (`scannedBundle` names it), one level deep: a bundle
        that sits inside another, or one that holds bundles itself, cannot take
        part, and neither can a bundle go inside itself — those answer 409. A
        unit or bundle in another kit is moved only with `moveFromOtherBundle`
        — without it the answer is `in_other_bundle`, naming that kit, so the
        client can ask first. Answers 200 for every outcome; an error status
        means it could not go in (retired, unavailable, no room in the bundle
        type, the nesting rules).
      parameters:
        - $ref: '#/components/parameters/BundleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BundleScanRequest'
      responses:
        '200':
          description: What happened, and the kit as it is now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BundleScanResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/bundles/{bundleId}/units/{assetId}:
    delete:
      operationId: removeFromBundle
      tags: [bundles]
      summary: Take a unit out of the kit
      description: Its accessories leave with it. The unit stays where it is.
      parameters:
        - $ref: '#/components/parameters/BundleId'
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The kit as it is now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BundleDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/bundles/{bundleId}/bundles/{innerBundleId}:
    delete:
      operationId: removeBundleFromBundle
      tags: [bundles]
      summary: Take a kit out of the kit it sits in
      description: The inner kit stays where it is, with everything in it.
      parameters:
        - $ref: '#/components/parameters/BundleId'
        - name: innerBundleId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The outer kit as it is now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BundleDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/bundles/{bundleId}/loose:
    get:
      operationId: searchLooseForBundle
      tags: [bundles]
      summary: Find loose units for the kit by name
      description: |
        The kit's organization's units in no kit and not out, whose product
        matches `q` (same rules as every search box), by product and shelf —
        for cables without a tag, which a scan cannot put in.
      parameters:
        - $ref: '#/components/parameters/BundleId'
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Up to 40 groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LooseGroup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: addLooseToBundle
      tags: [bundles]
      summary: Put a number of one product's loose units into the kit
      description: Untagged units first, then by unit number. `count` in the answer is how many went in.
      parameters:
        - $ref: '#/components/parameters/BundleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LooseAddRequest'
      responses:
        '200':
          description: The kit as it is now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LooseAddResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/inventory/products:
    get:
      operationId: listInventoryProducts
      tags: [inventory]
      summary: What the caller's organizations hold, per product
      description: |
        One row per product and organization, with how many active units it
        holds — counted on the server, so a list of every product the
        warehouse has needs no walk through every unit. Only products with at
        least one unit after the filters. `looseOnly` leaves out units in a
        kit, for a list that shows the kits as rows of their own (the web's
        Bundle View). `q` matches by the same rules as every search box
        (product name, caption, manufacturer, cable ends). Sorted by product
        name.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: organizationId
          in: query
          required: false
          schema:
            type: string
        - name: locationId
          in: query
          required: false
          schema:
            type: string
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
        - name: looseOnly
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Rows by product name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryProduct'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A better-auth session token.

  parameters:
    StocktakeId:
      name: stocktakeId
      in: path
      required: true
      schema:
        type: string
    ProductionId:
      name: productionId
      in: path
      required: true
      schema:
        type: string
    BundleId:
      name: bundleId
      in: path
      required: true
      schema:
        type: string
    CheckId:
      name: checkId
      in: path
      required: true
      schema:
        type: string

    HandoutMode:
      name: mode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/HandoutMode'

  responses:
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, expired or invalid token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The record exists but belongs to another organization.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: |
        The record exists but its state forbids the operation — a sold or
        decommissioned asset can no longer be booked (`asset_retired`), and a
        unit held back as unavailable cannot be checked out
        (`asset_unavailable`), and nothing is checked out to a production that
        has been cancelled (`production_cancelled`). A code that matched more
        than one unit's serial number identifies nothing in particular
        (`serial_ambiguous`) — the asset tag is what disambiguates it.

        Tags: a tag has to start with the org's prefix
        (`asset_tag_prefix_mismatch`), can be on one unit only
        (`asset_tag_in_use`), and a unit that already carries one is not
        retagged from a scanner (`asset_already_tagged`).

        Stocktakes: a closed one takes no more counting (`stocktake_closed`),
        a scope that matches nothing starts nothing (`stocktake_empty`), and
        a note or untick needs a unit that was counted (`stocktake_not_found_yet`).
        A count is only taken for a product the stocktake counts loose
        (`stocktake_product_not_counted`), and a count sent with `previous` is
        refused when the caller's stored count is no longer that
        (`stocktake_count_changed`) — reload and count again.

        Case checks: a unit that is neither in a kit nor has accessories, or
        an accessory, is no case to check (`not_a_case`).

        Inspections: a sold or decommissioned unit is not inspected
        (`asset_retired`).

        Catalog: a product name its manufacturer already uses, or a category
        name already taken, is refused (`conflict`).

        Loans: a lending org checks out only units the production has booked
        and approved (`not_approved`). A closed production check takes no more
        ticks (`check_closed`), and a cancelled production is not checked
        (`production_cancelled`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: >-
        No such record — or, for a filter that names one, no such record the
        caller could have named (`production_not_found`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    OAuthError:
      description: An RFC 8628 error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthError'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable identifier.
              examples:
                [
                  unauthorized,
                  asset_not_found,
                  forbidden,
                  asset_retired,
                  asset_unavailable,
                  production_cancelled,
                  stocktake_closed
                ]
            message:
              type: string
              description: Human-readable text, safe to show to the operator.
            params:
              type: array
              description: |
                Values a client's own wording of `code` names, by position —
                the kits of a `kit_*` refusal. Left out where the code needs
                none.
              items:
                type: string

    OAuthError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
            - authorization_pending
            - slow_down
            - access_denied
            - expired_token
            - invalid_request
            - invalid_grant
        error_description:
          type: string

    DeviceCodeRequest:
      type: object
      required: [client_id]
      properties:
        client_id:
          type: string
          examples: [technikpool-scanner]
        scope:
          type: string

    DeviceCodeResponse:
      type: object
      required: [device_code, user_code, verification_uri, expires_in, interval]
      properties:
        device_code:
          type: string
          description: Secret. Sent when polling; never shown to the user.
        user_code:
          type: string
          description: Short code shown on the device for a human to type.
          examples: [W8CSZRHS]
        verification_uri:
          type: string
        verification_uri_complete:
          type: string
          description: verification_uri with the user code pre-filled.
        expires_in:
          type: integer
          description: Seconds until the device code expires.
        interval:
          type: integer
          description: Minimum seconds between polls.

    DeviceTokenRequest:
      type: object
      required: [grant_type, device_code, client_id]
      properties:
        grant_type:
          type: string
          # A single-value enum here generates an unusable identifier in Dart
          # (the URN can't be one), so this stays a documented constant string.
          description: Always `urn:ietf:params:oauth:grant-type:device_code`.
          examples: ['urn:ietf:params:oauth:grant-type:device_code']
        device_code:
          type: string
        client_id:
          type: string

    DeviceTokenResponse:
      type: object
      required: [access_token, token_type]
      properties:
        access_token:
          type: string
          description: A better-auth session token. Use as the bearer credential.
        token_type:
          type: string
          examples: [Bearer]
        expires_in:
          type: integer
        scope:
          type: string

    SignInResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        redirect:
          type: boolean

    User:
      type: object
      required: [id, email, emailVerified]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: [string, 'null']
        emailVerified:
          type: boolean
        image:
          type: [string, 'null']

    Organization:
      type: object
      required: [id, name, color, avatarLabel]
      properties:
        id:
          type: string
        name:
          type: string
        shortName:
          type: [string, 'null']
          description: Abbreviation to prefer wherever space is tight.
        color:
          type: string
          description: Hex colour for the org badge.
        avatarLabel:
          type: string

    CableColorScheme:
      type: object
      required: [organizationId, bands]
      properties:
        organizationId:
          type: string
        bands:
          type: array
          description: Shortest first.
          items:
            $ref: '#/components/schemas/CableColorBand'

    CableColorBand:
      type: object
      required: [maxLengthCm, paletteKey, customName, customHex]
      properties:
        maxLengthCm:
          type: integer
          description: |
            Upper bound, inclusive. The band covers every length above the
            next shorter band's bound up to this one.
        paletteKey:
          type: [string, 'null']
          description: |
            One of the fixed tape colours — `red`, `blue`, `green`, `yellow`,
            `white`, `black`, `orange`, `brown`, `grey`, `violet`, `pink`,
            `turquoise` — which the client names in its own language. Null for
            a colour of the organization's own. Not an enum, so a colour added
            later does not break an older client; one it does not know it may
            show as grey.
        customName:
          type: [string, 'null']
          description: The organization's own colour's name, when `paletteKey` is null.
        customHex:
          type: [string, 'null']
          description: The organization's own colour as `#rrggbb`, when `paletteKey` is null.

    LegalLink:
      type: object
      required: [kind, url]
      properties:
        kind:
          type: string
          enum: [imprint, privacy, terms]
          description: What the page is; the client names it in its own language.
        url:
          type: string
          format: uri

    CurrentUser:
      type: object
      required: [user, isAdmin, organizations]
      properties:
        user:
          $ref: '#/components/schemas/User'
        isAdmin:
          type: boolean
          description: System-level admin, sees every organization.
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/MemberOrganization'

    MemberOrganization:
      type: object
      description: >-
        An organization the caller belongs to, and the rung they stand on in it.
        Spelled out rather than composed from Organization because only this
        response carries a role: an organization named by an asset or a
        production is a label, not a statement about the caller.
      required: [id, name, color, avatarLabel]
      properties:
        id:
          type: string
        name:
          type: string
        shortName:
          type: [string, 'null']
          description: Abbreviation to prefer wherever space is tight.
        color:
          type: string
          description: Hex colour for the org badge.
        avatarLabel:
          type: string
        role:
          type: string
          enum: [DEVICE_VIEWER, VIEWER, MEMBER, ADMIN, OWNER]
          description: >-
            What the caller may do here, as a ladder: each rung can do
            everything below it. DEVICE_VIEWER sees the equipment only —
            booking or returning anything needs MEMBER or above, so a client
            can stop offering a scan that the server will refuse.

            Absent where there is no membership at all, which only happens for
            a system admin: `isAdmin` is what grants them that organization.
            Omitted rather than null so the value stays a plain enum — a null
            member generates an unusable identifier in the Dart client.

    Address:
      type: object
      required: [id, line1, postalCode, city]
      properties:
        id:
          type: string
        line1:
          type: string
        line2:
          type: [string, 'null']
        postalCode:
          type: string
        city:
          type: string

    Location:
      type: object
      required: [id, name, organization]
      properties:
        id:
          type: string
        name:
          type: string
        organization:
          $ref: '#/components/schemas/Organization'
        address:
          oneOf:
            - $ref: '#/components/schemas/Address'
            - type: 'null'

    Production:
      type: object
      required: [id, name, organization]
      properties:
        id:
          type: string
        name:
          type: string
        startDate:
          type: [string, 'null']
          format: date-time
        endDate:
          type: [string, 'null']
          format: date-time
        organization:
          $ref: '#/components/schemas/Organization'
        checkoutRole:
          type: string
          enum: [production, lender, none]
          description: |
            `production`: a member of the org that runs it — anything can be
            checked out to it. `lender`: it has the caller's org's units booked
            and approved, and only those can be. `none`: read only.
        canCheck:
          type: boolean
          description: Whether the caller may check its list — crew may, without booking rights.

    Asset:
      type: object
      required: [id, status, product, location, organization]
      properties:
        id:
          type: string
        assetTag:
          type: [string, 'null']
          description: The printed tag. Null for assets that have never been labelled.
        serialNumber:
          type: [string, 'null']
        orgIndex:
          type: integer
          description: |
            The unit's number within its organization, 1 onwards, for its whole
            life and never reused — shown as "#123". Not required, so an older
            client keeps compiling.
        status:
          type: string
          description: |
            `SOLD` and `DECOMMISSIONED` are end of life: the unit has left the
            pool, cannot be booked or scanned onto anything, and is omitted from
            listAssets. getAssetByTag still returns it, so a scan of a retired
            sticker explains itself instead of reading as an unknown tag. Such a
            unit is no longer *at* its `location` — that is where it stood when
            it went.

            `UNAVAILABLE` is held back rather than gone: still in the pool, still
            listed, still scannable onto a location, but a scan that would check
            it out to a production is refused with `asset_unavailable`.
            `MAINTENANCE` and `BROKEN` describe condition only and do not stop a
            checkout.
          enum: [AVAILABLE, UNAVAILABLE, MAINTENANCE, BROKEN, SOLD, DECOMMISSIONED]
        product:
          $ref: '#/components/schemas/Product'
        location:
          $ref: '#/components/schemas/Location'
        organization:
          $ref: '#/components/schemas/Organization'
        bundleId:
          type: [string, 'null']
        parentAssetId:
          type: [string, 'null']
          description: |
            Set when this unit is an accessory of another — its case, its power
            supply, its brackets. An accessory travels with its parent: it is
            booked, moved and returned whenever the parent is, and is never
            picked on its own. Scanning it alone still moves only itself.

    Product:
      type: object
      required: [id, name, manufacturerName, category]
      properties:
        id:
          type: string
        name:
          type: string
        manufacturerName:
          type: [string, 'null']
          description: |
            Null for a product nobody makes in particular — a Schuko lead, a
            generic laptop. Show the product name alone then, not a placeholder.
        caption:
          type: [string, 'null']
          description: |
            What the team calls this product ("16-port PoE switch"), to be
            shown after its name. Not required, so an older client keeps
            compiling.
        details:
          type: [string, 'null']
          description: |
            Free text about the product — handling notes and the like. For a
            view of the product or one of its units, not for lists.
        category:
          $ref: '#/components/schemas/Category'
        imageUrl:
          type: [string, 'null']
        cable:
          description: |
            Present only for cables. The name already carries type and length;
            this is the structured form, for filtering and for showing the ends
            without parsing a label. Deliberately not required, like
            Location.address: a client that predates it keeps compiling.
          oneOf:
            - $ref: '#/components/schemas/CableSpec'
            - type: 'null'

    CableSpec:
      type: object
      required: [type, connectorA, connectorB, lengthCm, ways]
      properties:
        type:
          type: [string, 'null']
          description: |
            The wire rather than the ends — `CAT7`, `2,5 mm²`, `DMX`. Free text,
            not an enum, and null on most cables: what a lead is, is usually said
            completely by its connectors and its length.
        connectorA:
          type: [string, 'null']
          description: |
            The single pair of an ordinary lead. Null on a loom, which carries
            its ends in `ways` instead — a cable is one or the other, never both.
        connectorB:
          type: [string, 'null']
        lengthCm:
          type: [integer, 'null']
          description: Whole centimetres.
        ways:
          type: array
          description: |
            A loom's ways: two or more pairs of ends running the length of one
            cable. Empty on an ordinary lead.
          items:
            $ref: '#/components/schemas/CableWay'

    CableWay:
      type: object
      required: [count, type, connectorA, connectorB]
      description: |
        One way of a loom. Identical ways are one entry with a count — "6× Schuko
        M→F" is a number, not six entries.
      properties:
        count:
          type: integer
          minimum: 1
        type:
          type: [string, 'null']
          description: This way's wire, where a loom's ways differ — `2,5 mm²`, `CAT7`.
        connectorA:
          type: [string, 'null']
        connectorB:
          type: [string, 'null']

    Category:
      type: object
      required: [id, name, color, sortOrder]
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
          description: |
            Hex, `#rrggbb`. User-chosen and unconstrained, so it runs from white
            to near-black — derive the text colour from its luminance rather
            than assuming a dark background.
        sortOrder:
          type: integer
          description: Ascending, ties broken by name. listCategories applies both.
        requiresInspection:
          type: boolean
          description: |
            Whether units in this category need electrical (DGUV V3)
            inspections, unless their product says otherwise. Not required, so
            an older client keeps compiling.
        inspectionTypeIds:
          type: array
          description: |
            Every inspection type units in this category need by default.
            Not required, so an older client keeps compiling.
          items:
            type: string

    CategoryUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          description: The English source name. Unique.
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
        sortOrder:
          type: integer
        requiresInspection:
          type: boolean
          description: The electrical type. Same as `inspections` with its id.
        inspections:
          type: object
          description: Inspection type id → whether units in this category need it by default.
          additionalProperties:
            type: boolean

    CategoryUpdated:
      type: object
      required: [category, unitsChanged]
      properties:
        category:
          $ref: '#/components/schemas/Category'
        unitsChanged:
          type: integer
          description: Units whose inspection interval this change set or cleared.

    CatalogProduct:
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          required: [requiresInspection, inspectionRequired, isLicense, mainsConnectors, units]
          properties:
            requiresInspection:
              type: [boolean, 'null']
              description: The product's own answer for electrical inspections. Null follows its category.
            inspectionRequired:
              type: boolean
              description: |
                Whether its units need electrical (DGUV V3) inspections:
                `requiresInspection`, else the category's. A licence never does.
            inspections:
              type: array
              description: |
                Per inspection type, whether its units need it and whether
                that is the product's own answer. Every type is listed. Not
                required, so an older client keeps compiling.
              items:
                $ref: '#/components/schemas/ProductInspectionRequirement'
            isLicense:
              type: boolean
            notInterchangeable:
              type: boolean
              description: |
                Its units are never swapped for one another in a kit or on a
                unit (see `ScanSwap`). Not required, so an older client keeps
                compiling.
            isContainer:
              type: boolean
              description: |
                Its units are containers (Behälter). One inside a fixed bundle
                is that bundle's case: its tag is the bundle's number and
                scanning it means the whole kit (`BundleDetail.caseUnitId`).
                One in no bundle is a pack case: during a production, what is
                packed into it is listed under it — see
                `packIntoProductionCase`. Not required, so an older client
                keeps compiling.
            mainsConnectors:
              type: array
              description: |
                Connectors carrying mains voltage it has — on its panel, at a
                cable end or on a loom's way. A product with one is electrical
                equipment and normally needs inspecting.
              items:
                type: string
            ports:
              type: array
              description: The device's built-in connectors, in panel order. Empty on a cable.
              items:
                $ref: '#/components/schemas/ProductPort'
            units:
              $ref: '#/components/schemas/CatalogProductUnits'

    ProductInspectionRequirement:
      type: object
      required: [typeId, required, override]
      properties:
        typeId:
          type: string
        required:
          type: boolean
          description: The answer that applies, after the category default. A licence needs none.
        override:
          type: [boolean, 'null']
          description: The product's own answer. Null follows its category.

    CatalogProductUnits:
      type: object
      description: Active units of the caller's organizations.
      required: [active, tracked, overdue]
      properties:
        active:
          type: integer
        tracked:
          type: integer
          description: Units that carry an inspection interval.
        overdue:
          type: integer
          description: Units whose inspection is due today or earlier.

    CatalogProductPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogProduct'
        nextCursor:
          type: [string, 'null']
          description: Pass as `cursor` for the next page. Null on the last page.

    ProductUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        caption:
          type: string
          description: '`""` clears it.'
        details:
          type: string
          description: '`""` clears it.'
        manufacturerId:
          type: [string, 'null']
          description: From listManufacturers or createManufacturer. Null says nobody in particular makes it.
        categoryId:
          type: string
        isLicense:
          type: boolean
          description: A cable is never a licence; `true` on a cable is ignored.
        notInterchangeable:
          type: boolean
          description: |
            `true` keeps its units from being swapped for one another when
            handing out or checking a case (see `ScanSwap`) — a calibrated lens
            that belongs to exactly one camera. Identity like the name.
        isContainer:
          type: boolean
          description: |
            `true` makes its units containers: a bundle's case inside a
            bundle, a pack case outside one (see `CatalogProduct`). Identity
            like the name.
        requiresInspection:
          type: [boolean, 'null']
          description: The electrical type. Null follows the category again.
        inspections:
          type: object
          description: |
            Inspection type id → the product's own answer, or null to follow
            the category again. Types left out are left alone.
          additionalProperties:
            type: [boolean, 'null']
        cable:
          description: |
            The cable's ends, length and wire, or the loom's ways — replaced
            wholesale. Null says this is not a cable and clears all of it.
          oneOf:
            - $ref: '#/components/schemas/CableUpdate'
            - type: 'null'
        ports:
          type: array
          maxItems: 100
          description: The device's built-in connectors in panel order, replacing the panel. `[]` clears it.
          items:
            $ref: '#/components/schemas/ProductPortInput'

    CableUpdate:
      type: object
      additionalProperties: false
      properties:
        type:
          type: [string, 'null']
          description: The wire — `CAT7`, `2,5 mm²`. Usually null.
        connectorA:
          type: [string, 'null']
        connectorB:
          type: [string, 'null']
        lengthCm:
          type: [integer, 'null']
          minimum: 1
        ways:
          type: array
          description: A loom's ways. Leave `connectorA`/`connectorB` null on a loom.
          items:
            type: object
            additionalProperties: false
            required: [count]
            properties:
              count:
                type: integer
                minimum: 1
                maximum: 99
              type:
                type: [string, 'null']
              connectorA:
                type: [string, 'null']
              connectorB:
                type: [string, 'null']

    ProductPortInput:
      type: object
      additionalProperties: false
      required: [connector, count]
      properties:
        connector:
          type: string
          description: A connector name from listConnectors.
        count:
          type: integer
          minimum: 1
          maximum: 999
        label:
          type: [string, 'null']
          maxLength: 80
          description: What the panel is printed with — `DMX In`, `Power Out`.
        requirement:
          $ref: '#/components/schemas/PortRequirement'

    PortRequirement:
      type: [string, 'null']
      enum: [required, A, B, null]
      description: |
        Whether the port must be connected for a production's connection
        check: `required` alone, or a letter shared by alternatives of which
        one is enough. Null when it need not be.

    ProductPort:
      type: object
      required: [connector, count, label, requirement]
      properties:
        connector:
          type: string
        count:
          type: integer
        label:
          type: [string, 'null']
        requirement:
          $ref: '#/components/schemas/PortRequirement'

    Connector:
      type: object
      required: [name, family, mains, productCount]
      properties:
        productCount:
          type: integer
          description: Products naming it at a cable end, on a loom's way or on their panel.
        name:
          type: string
        family:
          type: [string, 'null']
          description: What it mates with — `Schuko M` and `Schuko F` are both `Schuko`.
        mains:
          type: boolean
          description: Carries mains voltage. A product with one is electrical equipment.

    ProductUpdated:
      type: object
      required: [product, unitsChanged]
      properties:
        product:
          $ref: '#/components/schemas/CatalogProduct'
        unitsChanged:
          type: integer
          description: Units whose inspection interval this change set or cleared.

    ProductDeleted:
      type: object
      required: [id]
      properties:
        id:
          type: string

    ProductMergeRequest:
      type: object
      additionalProperties: false
      required: [sourceProductId]
      properties:
        sourceProductId:
          type: string
          description: The duplicate. Its units move, then it is deleted.

    ProductMerged:
      type: object
      required: [product, movedUnits, inheritedImage, inheritedCable, inheritedLicense]
      properties:
        product:
          $ref: '#/components/schemas/CatalogProduct'
        movedUnits:
          type: integer
          description: Units moved over, retired ones included.
        inheritedImage:
          type: boolean
        inheritedCable:
          type: boolean
        inheritedLicense:
          type: boolean

    Manufacturer:
      type: object
      required: [id, name, productCount]
      properties:
        id:
          type: string
        name:
          type: string
        productCount:
          type: integer

    ManufacturerCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    ManufacturerCreated:
      type: object
      required: [manufacturer, created]
      properties:
        manufacturer:
          $ref: '#/components/schemas/Manufacturer'
        created:
          type: boolean
          description: False when the catalog already had a manufacturer of that name.

    ManufacturerUpdateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    ManufacturerMergeRequest:
      type: object
      additionalProperties: false
      required: [sourceManufacturerId]
      properties:
        sourceManufacturerId:
          type: string

    ManufacturerMerged:
      type: object
      required: [manufacturer, movedProducts]
      properties:
        manufacturer:
          $ref: '#/components/schemas/Manufacturer'
        movedProducts:
          type: integer

    ConnectorCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        family:
          type: [string, 'null']
          description: What it mates with. Defaults to the name's first word.

    ConnectorUpdateRequest:
      type: object
      additionalProperties: false
      required: [mains]
      properties:
        mains:
          type: boolean

    CatalogLogEntry:
      type: object
      required: [id, action, createdAt, userName, productId, manufacturerId, categoryId, data]
      properties:
        id:
          type: string
        action:
          type: string
          description: |
            `PRODUCT_UPDATED`, `PRODUCT_DELETED`, `PRODUCT_MERGED`,
            `PRODUCT_PRICE_SET`, `PRODUCT_DOCUMENT_ADDED`,
            `PRODUCT_DOCUMENT_REMOVED`, `MANUFACTURER_UPDATED`,
            `MANUFACTURER_MERGED` or `CATEGORY_UPDATED`. Only a
            `PRODUCT_UPDATED` entry can be reverted.
        createdAt:
          type: string
          format: date-time
        userName:
          type: [string, 'null']
          description: Null once the account has been deleted.
        productId:
          type: [string, 'null']
          description: May name a product that no longer exists.
        productName:
          type: [string, 'null']
          description: The product's label now, while it still exists.
        manufacturerId:
          type: [string, 'null']
        categoryId:
          type: [string, 'null']
        data:
          description: |
            What the entry recorded. For an update, `changes` lists
            `{ field, from, to }` per field that moved, and `revertOf` names
            the entry a revert undid.
          type: [object, 'null']
          additionalProperties: true

    AssetDetail:
      allOf:
        - $ref: '#/components/schemas/Asset'
        - type: object
          required: [history, currentProduction]
          properties:
            currentProduction:
              description: >-
                The production this asset is currently checked out to, if any. A
                production of an organization the caller is not a member of is
                still reported — the unit is not free — but its `name` is that
                organization's name, since the caller may not see the production
                itself.
              oneOf:
                - $ref: '#/components/schemas/Production'
                - type: 'null'
            kit:
              description: |
                The kit the unit is in, if any. Not required, so an older client
                keeps compiling.
              oneOf:
                - $ref: '#/components/schemas/ListKit'
                - type: 'null'
            isBundleCase:
              type: boolean
              description: |
                The unit is its kit's case (a container in it, see
                `BundleDetail.caseUnitId`): its tag is the kit's number, and
                scanning it means the whole kit. Show "Case of <kit>". Not
                required, so an older client keeps compiling.
            history:
              type: array
              description: Most recent transactions first.
              items:
                $ref: '#/components/schemas/AssetTransaction'
            documents:
              type: array
              description: |
                The product's PDFs, manuals first. Not required, so an older
                client keeps compiling.
              items:
                $ref: '#/components/schemas/ProductDocument'
            inspectionIntervalMonths:
              type: [integer, 'null']
              description: |
                Months between electrical (DGUV V3) inspections. Null when the
                unit is not tracked for them. Not required, so an older client
                keeps compiling.
            nextInspectionDue:
              type: [string, 'null']
              format: date-time
              description: |
                When the next inspection of any type is due — derived, see the
                `inspection` tag. Null when not tracked. Not required, so an
                older client keeps compiling.
            inspectionSchedules:
              type: array
              description: |
                Every inspection type the unit is tracked for, in type order.
                Not required, so an older client keeps compiling.
              items:
                $ref: '#/components/schemas/InspectionSchedule'
            inspections:
              type: array
              description: |
                The unit's inspections of every type, latest first, at most
                ten. Not required, so an older client keeps compiling.
              items:
                $ref: '#/components/schemas/Inspection'

    ProductDocument:
      type: object
      required: [id, kind, title, url, sizeBytes]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [MANUAL, DATASHEET, OTHER]
        title:
          type: string
        url:
          type: string
          description: |
            Absolute address of the PDF. Public, like Product.imageUrl — it
            opens without a session, so hand it straight to a viewer.
        sizeBytes:
          type: integer

    AssetTransaction:
      type: object
      required: [id, action, createdAt]
      properties:
        id:
          type: string
        action:
          type: string
          examples: [CHECKED_OUT, RETURNED, LOCATION_ASSIGNED]
        createdAt:
          type: string
          format: date-time
        userName:
          type: [string, 'null']
          description: Who performed it. Null if the account has since been removed.
        productionName:
          type: [string, 'null']
          description: >-
            The production involved, if any. For a production of an organization
            the caller is not a member of, that organization's name instead.
        inspection:
          description: |
            For `INSPECTED` and `INSPECTION_DELETED`: the inspection the entry
            is about. Null for every other action. Not required, so an older
            client keeps compiling.
          oneOf:
            - $ref: '#/components/schemas/TransactionInspection'
            - type: 'null'
        swap:
          description: |
            For `SWAPPED`: the unit it changed places with, and where this one
            is now. Null for every other action. Not required, so an older
            client keeps compiling.
          oneOf:
            - $ref: '#/components/schemas/TransactionSwap'
            - type: 'null'
        kitSwap:
          description: |
            For `KIT_REPLACED`: the kit this unit is in and the other one.
            Null for every other action. Not required, so an older client
            keeps compiling.
          oneOf:
            - $ref: '#/components/schemas/TransactionKitSwap'
            - type: 'null'

    TransactionKitSwap:
      type: object
      required: [role, kitName, otherKitId, otherKitName]
      properties:
        role:
          type: string
          enum: [took_over, released]
          description: |
            `took_over`: this unit's kit went out in `otherKit`'s place and
            took its booking over. `released`: `otherKit` went out instead,
            and this unit's kit stays home.
        kitName:
          type: string
          description: This unit's kit, with its number, as it read then.
        otherKitId:
          type: string
        otherKitName:
          type: string

    TransactionSwap:
      type: object
      required: [partnerAssetId, partnerLabel, now, before, via]
      properties:
        partnerAssetId:
          type: string
        partnerLabel:
          type: string
          description: The other unit's tag, else its number.
        now:
          type: [string, 'null']
          description: The kit or unit this one is in since, by name. Null is loose.
        before:
          type: [string, 'null']
          description: Where it was before. Null is loose.
        via:
          type: string
          enum: [handout, case_check]

    TransactionInspection:
      type: object
      required: [performedAt, result]
      properties:
        typeId:
          type: string
          description: Not required, so an older client keeps compiling.
        performedAt:
          type: string
          format: date-time
          description: The day it took place, as midnight UTC.
        result:
          $ref: '#/components/schemas/InspectionResult'
        inspectorName:
          type: [string, 'null']
        markedBroken:
          type: boolean
          description: This inspection failed and set the unit to its type's `failStatus`.

    AssetPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
        nextCursor:
          type: [string, 'null']
          description: Pass as `cursor` for the next page. Null on the last page.

    ScanRequest:
      type: object
      required: [assetTag, targetType, targetId]
      properties:
        assetTag:
          type: string
          description: |
            Exactly what the barcode decoded to — an asset tag, or a serial
            number that belongs to exactly one unit.
        targetType:
          type: string
          enum: [location, production]
        targetId:
          type: string

    ScanResult:
      type: object
      required: [asset, action, targetName, returnedFrom]
      properties:
        asset:
          $ref: '#/components/schemas/ScannedAsset'
        action:
          type: string
          enum: [LOCATION_ASSIGNED, CHECKED_OUT]
        targetName:
          type: string
          description: Name of the location or production, for the session log.
        returnedFrom:
          type: array
          description: Productions the asset was automatically returned from.
          items:
            type: string
        group:
          description: |
            Set when the scanned unit belongs with others — the rest of its kit,
            or the unit it hangs off and that unit's other accessories. Only the
            scanned unit was booked; offer these, and book the ones picked with
            `createScanBatch`. Not required, so an older client keeps working.
          oneOf:
            - $ref: '#/components/schemas/ScanGroup'
            - type: 'null'
        kit:
          description: |
            Set when the code was a kit's number — its own tag, or the tag of
            the container that is its case, which always means the whole kit
            rather than the box. Every unit in it that the
            caller may book went to the target at once, accessories along. `asset`
            then stands for the kit — the id of its first unit, the kit's name
            and tag — so an older client still reports something true. Ask about
            `kit.units` and book back what is missing. Not required, so an older
            client keeps working.
          oneOf:
            - $ref: '#/components/schemas/ScanKit'
            - type: 'null'
        overdueInspections:
          type: array
          description: |
            Checking out: how many of the units just booked are overdue, per
            inspection type. Never a refusal — warn. Empty otherwise. Not
            required, so an older client keeps compiling.
          items:
            $ref: '#/components/schemas/OverdueInspection'
        swap:
          description: |
            Checking out: the scanned unit went out in the place of a linked
            unit of the same product booked here — one booked as part of its
            kit, or as an accessory of its unit — and the two swapped places.
            Show it; nothing to confirm. Null otherwise. Not required, so an
            older client keeps compiling.
          oneOf:
            - $ref: '#/components/schemas/ScanSwap'
            - type: 'null'
        kitSwap:
          description: |
            Checking out a kit's number: the kit went out in the place of the
            kit of its type booked here, and the booking moved to it. Show it;
            nothing to confirm. Null otherwise. Not required, so an older
            client keeps compiling.
          oneOf:
            - $ref: '#/components/schemas/ScanKitSwap'
            - type: 'null'
        packCase:
          description: |
            On a production's handout list: the scanned unit is a pack case.
            It was booked like any unit (on `checkout` even when it was not
            booked here). Handing out, open it — or, with another case open,
            ask whether it goes into that one (`packIntoProductionCase`) or
            is opened instead. Taking back, offer what is still in it to tick:
            the units listed under it. Null otherwise. Not required, so an
            older client keeps compiling.
          oneOf:
            - $ref: '#/components/schemas/PackCaseRef'
            - type: 'null'
        packedInto:
          type: [string, 'null']
          description: |
            On the handout list: the case (its asset id) the scanned unit, or
            every unit of a scanned kit, was packed into — the `packInto` of
            the request. Not required, so an older client keeps compiling.

    PackCaseRef:
      type: object
      required: [assetId, name, tag, orgIndex]
      description: |
        A pack case: an ordinary unit whose product is a container and that
        is in no bundle. Show
        it as "Case 3 (Transflex 60×40)" — its tag, else "#" and its number,
        then the product.
      properties:
        assetId:
          type: string
        name:
          type: string
          description: The product's name with its caption.
        tag:
          type: [string, 'null']
        orgIndex:
          type: integer
          description: The unit's number in its organization.

    PackCase:
      allOf:
        - $ref: '#/components/schemas/PackCaseRef'
        - type: object
          required: [path]
          properties:
            path:
              type: array
              description: |
                The cases around this one, outermost first, ending with the
                one it sits in. Empty for a case packed in nothing.
              items:
                $ref: '#/components/schemas/PackCaseRef'

    HandoutScanRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
        packInto:
          type: [string, 'null']
          description: |
            `checkout` only: the case open on the device (its asset id). The
            scanned unit — every unit of a kit's sticker — goes into it, and
            out with it. A scanned case is never packed this way: it answers
            `packCase`, and the client asks.

    PackRequest:
      type: object
      properties:
        caseAssetId:
          type: [string, 'null']
          description: |
            The case to pack into (its asset id). Null or left out takes the
            units out of the case they are in.
        assetIds:
          type: array
          description: Units, a whole kit's included; accessories go with their unit.
          items:
            type: string
        line:
          description: Part of a counted line — `count` of its units, the ones already out first.
          oneOf:
            - $ref: '#/components/schemas/ProductionListLineCount'
            - type: 'null'
        organizationId:
          type: [string, 'null']
          description: The side the list is seen from, as on the hand-out list.

    ScanSwap:
      type: object
      description: |
        Units stay linked — an accessory on its unit, a unit in its kit — but
        whoever packs takes the one at hand. When a unit of the same product
        and organization as a linked one is handed out (or found in that one's
        case), the scanned unit takes its place, and the other takes the
        scanned one's old place, or becomes loose if it had none. Never on
        take-back or in a stocktake, and never for a product marked
        `notInterchangeable`. Both units' histories say so (`SWAPPED`).
      required: [partnerAssetId, partnerLabel, joined, partnerTo]
      properties:
        partnerAssetId:
          type: string
          description: The unit whose place the scanned one took.
        partnerLabel:
          type: string
          description: Its tag, else its number ("#12").
        joined:
          type: string
          description: The kit, or the unit, the scanned unit is in now, by name.
        partnerTo:
          type: [string, 'null']
          description: Where the other unit went, by name. Null when it is now loose.

    ScanKitSwap:
      type: object
      description: |
        A whole kit standing in for the booked one: ring 1 is booked, ring 2's
        number is scanned. The booking moves to ring 2 — the same bundle type
        and organization, wholly free — and both kits keep their contents.
        Only while nothing of the booked kit has gone out; the lowest-numbered
        of several. Both kits' units' histories say so (`KIT_REPLACED`).
      required: [replacedKitId, replacedKitName, kitId, kitName]
      properties:
        replacedKitId:
          type: string
        replacedKitName:
          type: string
          description: The kit that stays home, with its number.
        kitId:
          type: string
        kitName:
          type: string
          description: The kit that went out, with its number.

    OverdueInspection:
      type: object
      required: [typeId, name, nameDe, count]
      properties:
        typeId:
          type: string
        name:
          type: string
        nameDe:
          type: [string, 'null']
        count:
          type: integer

    ScanKit:
      type: object
      required: [id, name, tag, units]
      properties:
        id:
          type: string
        name:
          type: string
          description: The kit's name with its caption.
        tag:
          type: [string, 'null']
        units:
          type: array
          description: |
            The kit's units this scan booked (or ticked), by name. Empty when none
            of them was on the list scanned into — the kit is not from here.
          items:
            $ref: '#/components/schemas/ScanGroupUnit'

    ListKit:
      type: object
      required: [id, name, tag]
      description: |
        The kit a unit on a list is in. A kit's units arrive one after another
        within their section, so a client starts a kit heading whenever it
        changes. An accessory carries its parent's kit. A kit inside another
        kit is a kit of its own here, with `parent` set, and its units follow
        the outer kit's.
      properties:
        id:
          type: string
        name:
          type: string
          description: The kit's name with its caption.
        tag:
          type: [string, 'null']
        parent:
          description: The kit this one sits inside, if any.
          oneOf:
            - $ref: '#/components/schemas/KitRef'
            - type: 'null'

    ScanGroup:
      type: object
      required: [kind, name, units]
      properties:
        kind:
          type: string
          enum: [bundle, parent]
          description: |
            `bundle`: the scanned unit is in a kit, and `units` is the rest of it.
            `parent`: the scanned unit is an accessory, and `units` is the unit it
            hangs off (first) and that unit's other accessories.
        name:
          type: string
          description: |
            The kit's or the parent unit's name, with its caption and its tag
            where it has them.
        units:
          type: array
          items:
            $ref: '#/components/schemas/ScanGroupUnit'

    ScanGroupUnit:
      type: object
      required: [id, assetTag, productName, manufacturerName, done]
      properties:
        id:
          type: string
        assetTag:
          type: [string, 'null']
        productName:
          type: string
        manufacturerName:
          type: [string, 'null']
        productCaption:
          type: [string, 'null']
          description: |
            The product's caption (see Product.caption), to be shown after the
            product name. Not required, so an older client keeps compiling.
        productImageUrl:
          type: [string, 'null']
          description: |
            The product's picture, absolute like Product.imageUrl — for a
            thumbnail beside the row. Null for a product without one. Not
            required, so an older client keeps compiling.
        done:
          type: boolean
          description: Already at the scan's target; nothing to book.

    InspectionResult:
      type: string
      enum: [PASSED, FAILED]

    InspectionType:
      type: object
      required:
        [
          id,
          key,
          name,
          nameDe,
          sortOrder,
          failStatus,
          requiresQualification,
          hasMeasurements,
          defaultIntervalMonths
        ]
      properties:
        id:
          type: string
        key:
          type: string
          description: |
            `electrical`, `lifting`, `visual` or `calibration` for the types
            every installation has. A type added later gets a key made from
            its name and means nothing special.
          examples: [electrical]
        name:
          type: string
          description: English.
        nameDe:
          type: [string, 'null']
          description: German. Null shows the English name.
        sortOrder:
          type: integer
        failStatus:
          type: string
          description: The status a failed inspection sets the unit to.
          examples: [BROKEN, MAINTENANCE, DECOMMISSIONED]
        requiresQualification:
          type: boolean
          description: Whether recording one takes a qualification for this type.
        hasMeasurements:
          type: boolean
          description: Whether an inspection of this type carries measured values.
        defaultIntervalMonths:
          type: [integer, 'null']
          description: The interval of an organization that has not set its own.

    InspectionSchedule:
      type: object
      required: [typeId, intervalMonths, nextDue]
      properties:
        typeId:
          type: string
        intervalMonths:
          type: integer
        nextDue:
          type: string
          format: date-time

    Inspection:
      type: object
      required: [id, assetId, performedAt, result, inspectorName, notes]
      properties:
        id:
          type: string
        assetId:
          type: string
        typeId:
          type: string
          description: Not required, so an older client keeps compiling.
        performedAt:
          type: string
          format: date-time
          description: The day it took place, as midnight UTC.
        result:
          $ref: '#/components/schemas/InspectionResult'
        inspectorName:
          type: [string, 'null']
          description: Who inspected it — the user who recorded it, or an outside firm.
        notes:
          type: [string, 'null']
        external:
          type: boolean
          description: Done by an outside firm and only entered. Not required, so an older client keeps compiling.
        qualification:
          type: [string, 'null']
          description: |
            The inspector's qualification at the time, e.g. Elektrofachkraft.
            Not required, so an older client keeps compiling.

    InspectionRequest:
      type: object
      required: [code, performedAt, result]
      properties:
        code:
          type: string
          description: The scanned asset tag, or a serial number.
        performedAt:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          description: The day it took place, `YYYY-MM-DD`. Not in the future.
          examples: ['2026-10-17']
        result:
          $ref: '#/components/schemas/InspectionResult'
        typeId:
          type: string
          description: From listInspectionTypes. Absent - electrical.
        external:
          type: boolean
          description: |
            Done by an outside firm and only entered here. Then
            `inspectorName` and `qualification` are the firm's, and required
            for a type that needs a qualification. Otherwise the caller must
            hold a qualification for the type in the unit's organization
            (`403 forbidden`), and the inspection is
            recorded under the caller's name.
        inspectorName:
          type: string
          description: The outside firm or inspector. Ignored unless `external`.
        qualification:
          type: string
          description: The outside inspector's qualification. Ignored unless `external`.
        notes:
          type: string

    InspectionRecorded:
      type: object
      required: [inspection, asset, nextInspectionDue, inspectionIntervalMonths, markedBroken]
      properties:
        inspection:
          $ref: '#/components/schemas/Inspection'
        asset:
          $ref: '#/components/schemas/Asset'
        inspectionIntervalMonths:
          type: [integer, 'null']
          description: The unit's interval for the recorded type. Null when not tracked for it.
        nextInspectionDue:
          type: [string, 'null']
          format: date-time
          description: |
            The unit's next due date for the recorded type after this
            inspection. Null when not tracked for it.
        markedBroken:
          type: boolean
          description: The inspection failed and set the unit to its type's `failStatus`.

    DefectRequest:
      type: object
      required: [code, notes]
      properties:
        code:
          type: string
          description: The scanned asset tag, or a serial number.
        notes:
          type: string
          minLength: 1
          maxLength: 2000
          description: What is wrong with it.

    DefectReported:
      type: object
      required: [asset, statusChanged]
      properties:
        asset:
          $ref: '#/components/schemas/Asset'
        statusChanged:
          type: boolean
          description: The unit was not in that status before.

    InspectionDeleted:
      type: object
      required: [assetId, nextInspectionDue]
      properties:
        assetId:
          type: string
        nextInspectionDue:
          type: [string, 'null']
          format: date-time

    AssetCreateRequest:
      type: object
      required: [productId, organizationId, locationId, assetTag]
      properties:
        productId:
          type: string
        organizationId:
          type: string
        locationId:
          type: string
          description: One of the organization's locations.
        assetTag:
          type: string
        bundleId:
          type: string
          description: |
            A kit of the same organization to put the unit straight into. Its
            own location wins over `locationId`, and the unit has to fit its
            bundle type. Not required, so an older client keeps compiling.

    AssetTagRequest:
      type: object
      required: [assetTag]
      properties:
        assetTag:
          type: string

    ScanBatchRequest:
      type: object
      required: [assetIds, targetType, targetId]
      properties:
        assetIds:
          type: array
          minItems: 1
          items:
            type: string
        targetType:
          type: string
          enum: [location, production]
        targetId:
          type: string

    ScanBatchResult:
      type: object
      required: [count, targetName]
      properties:
        count:
          type: integer
          description: Units booked, accessories taken along included.
        targetName:
          type: string
        swaps:
          type: array
          description: |
            Checking out: the units that went out in a linked unit's place and
            swapped with it — see `ScanSwap`. Not required, so an older client
            keeps compiling.
          items:
            $ref: '#/components/schemas/ScanSwap'
        kitSwaps:
          type: array
          description: |
            Checking out: the whole kits that took over the booking of a
            booked kit of their type — see `ScanKitSwap`. Not required, so an
            older client keeps compiling.
          items:
            $ref: '#/components/schemas/ScanKitSwap'

    ScannedAsset:
      type: object
      required: [id, assetTag, productName, manufacturerName]
      properties:
        ownerOrgId:
          type: string
          description: |
            The organization the unit belongs to. With `lengthCm`, what the
            cable colour is read off (see `GET /api/v1/cable-colors`). Not
            required, so an older client keeps compiling.
        lengthCm:
          type: [integer, 'null']
          description: The product's length in whole centimetres; null when it has none.
        id:
          type: string
        assetTag:
          type: string
        productName:
          type: string
        manufacturerName:
          type: [string, 'null']
          description: Null when the product has no maker; see Product.manufacturerName.
        productCaption:
          type: [string, 'null']
          description: |
            The product's caption (see Product.caption), to be shown after the
            product name. Not required, so an older client keeps compiling.

    StocktakeScopeRequest:
      type: object
      required: [organizationId]
      properties:
        organizationId:
          type: string
        locationIds:
          type: array
          description: |
            Only units at these locations: the org's own, or another org's holding its units.
            All of them when empty or absent.
          items:
            type: string
        categoryIds:
          type: array
          description: Only units whose product is in these categories. All when empty or absent.
          items:
            type: string

    StocktakeCreateRequest:
      allOf:
        - $ref: '#/components/schemas/StocktakeScopeRequest'
        - type: object
          properties:
            name:
              type: string
              description: Defaults to the date and the scope's locations.

    StocktakePreview:
      type: object
      required: [units, looseUnits, out, overlaps]
      properties:
        units:
          type: integer
          description: Units to find one by one — tagged, accessories, bundle members.
        looseUnits:
          type: integer
          description: Untagged units, counted per product rather than ticked.
        out:
          type: integer
          description: Checked out on a production, so accounted for rather than expected.
        overlaps:
          type: array
          items:
            $ref: '#/components/schemas/StocktakeOverlap'

    StocktakeOverlap:
      type: object
      required: [id, name, sharedUnits]
      properties:
        id:
          type: string
        name:
          type: string
        sharedUnits:
          type: integer

    StocktakeStatus:
      type: string
      enum: [OPEN, CLOSED]

    StocktakeProgress:
      type: object
      required: [expected, found, out, unexpected]
      properties:
        expected:
          type: integer
          description: Units to find, loose ones included. Excludes units checked out right now.
        found:
          type: integer
          description: >-
            Of `expected`, how many were counted. A surplus of one loose product
            does not make up for a shortfall of another.
        out:
          type: integer
          description: Checked out on a production and not scanned.
        unexpected:
          type: integer
          description: Scanned although not on the list.

    StocktakeLocation:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string

    StocktakeSummary:
      type: object
      required:
        [id, name, status, organization, createdAt, createdByName, progress, countingLocations]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          $ref: '#/components/schemas/StocktakeStatus'
        organization:
          $ref: '#/components/schemas/Organization'
        createdAt:
          type: string
          format: date-time
        createdByName:
          type: string
        closedAt:
          type: [string, 'null']
          format: date-time
        progress:
          $ref: '#/components/schemas/StocktakeProgress'
        countingLocations:
          type: array
          description: >-
            Where a counter can say they are counting: the scope's locations, or
            all of the organization's when the scope names none.
          items:
            $ref: '#/components/schemas/StocktakeLocation'

    StocktakeDetail:
      allOf:
        - $ref: '#/components/schemas/StocktakeSummary'
        - type: object
          required: [items, products]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/StocktakeItem'
            products:
              type: array
              description: Loose untagged units, one entry per product.
              items:
                $ref: '#/components/schemas/StocktakeProductCount'

    StocktakeItem:
      type: object
      required:
        - assetId
        - assetTag
        - productName
        - manufacturerName
        - category
        - parentAssetId
        - state
        - expectedLocation
        - foundLocation
        - foundByName
        - foundByMe
        - needsAttention
      properties:
        assetId:
          type: string
        assetTag:
          type: [string, 'null']
        serialNumber:
          type: [string, 'null']
        productName:
          type: string
        productCaption:
          type: [string, 'null']
          description: |
            The product's caption (see Product.caption), to be shown after the
            product name. Not required, so an older client keeps compiling.
        manufacturerName:
          type: [string, 'null']
        category:
          $ref: '#/components/schemas/Category'
        cable:
          description: |
            Present only for cables, as on Product: the name alone does not say
            which ends a lead has. Not required, so an older client keeps
            compiling.
          oneOf:
            - $ref: '#/components/schemas/CableSpec'
            - type: 'null'
        parentAssetId:
          type: [string, 'null']
          description: Set on an accessory; it is confirmed when its parent is scanned.
        bundleName:
          type: [string, 'null']
          description: The bundle it belongs to, with its caption and its tag where it has them.
        state:
          type: string
          enum: [open, found, out, missing, unexpected]
          description: |
            `open` is not counted yet; it turns into `missing` when the
            stocktake closes. `out` is checked out on a production (right now
            while open, at closing time once closed) and is accounted for.
            `unexpected` was scanned although it is not on the list — see
            `unexpectedReason`.
        expectedLocation:
          oneOf:
            - $ref: '#/components/schemas/StocktakeLocation'
            - type: 'null'
        foundLocation:
          oneOf:
            - $ref: '#/components/schemas/StocktakeLocation'
            - type: 'null'
        outAt:
          type: [string, 'null']
          description: The production it is checked out to.
        unexpectedReason:
          type: [string, 'null']
          description: One of `other_org`, `retired`, `other_location`, `out_of_scope`.
        foundByName:
          type: [string, 'null']
        foundByMe:
          type: boolean
          description: Only these can be unticked or annotated by the caller.
        note:
          type: [string, 'null']
        needsAttention:
          type: boolean

    StocktakeProductCount:
      type: object
      required:
        [productId, productName, manufacturerName, category, expected, out, counted, locations]
      properties:
        productId:
          type: string
        productName:
          type: string
        productCaption:
          type: [string, 'null']
          description: |
            The product's caption (see Product.caption), to be shown after the
            product name. Not required, so an older client keeps compiling.
        productImageUrl:
          type: [string, 'null']
          description: |
            The product's picture, absolute like Product.imageUrl. Null for a
            product without one. Not required, so an older client keeps
            compiling.
        manufacturerName:
          type: [string, 'null']
        category:
          $ref: '#/components/schemas/Category'
        cable:
          description: |
            Present only for cables, as on Product: the name alone does not say
            which ends a lead has. Not required, so an older client keeps
            compiling.
          oneOf:
            - $ref: '#/components/schemas/CableSpec'
            - type: 'null'
        expected:
          type: integer
        out:
          type: integer
        counted:
          type: integer
          description: Every counter's counts added up.
        locations:
          type: array
          items:
            $ref: '#/components/schemas/StocktakeLocationCount'

    StocktakeLocationCount:
      type: object
      required: [location, expected, counted, myCount]
      properties:
        location:
          $ref: '#/components/schemas/StocktakeLocation'
        expected:
          type: integer
        counted:
          type: integer
        myCount:
          type: [integer, 'null']
          description: The caller's own count here, if they entered one.

    StocktakeScanRequest:
      type: object
      required: [code, locationId]
      properties:
        code:
          type: string
          description: Exactly what the barcode decoded to.
        locationId:
          type: string
          description: Where the counter is. One of the stocktake's `countingLocations`.

    StocktakeScanResult:
      type: object
      required: [outcome, confirm]
      properties:
        outcome:
          type: string
          enum: [found, unexpected, already, bundle]
        item:
          description: The scanned unit. Absent for a bundle.
          oneOf:
            - $ref: '#/components/schemas/StocktakeItem'
            - type: 'null'
        wasOutAt:
          type: [string, 'null']
          description: It is checked out to this production, and is here after all.
        alreadyFoundByName:
          type: [string, 'null']
          description: For `already`, who counted it.
        bundle:
          oneOf:
            - $ref: '#/components/schemas/StocktakeBundle'
            - type: 'null'
        confirm:
          type: array
          description: |
            Accessories of the scanned unit, or the bundle's members — or, when
            `confirmGroup` is set, what the scanned unit belongs with.
          items:
            $ref: '#/components/schemas/StocktakeConfirmEntry'
        confirmGroup:
          description: |
            Set when a found unit belongs with others, and `confirm` lists them:
            `bundle` is the rest of its kit (its own accessories first), tick
            them with `via: bundle`; `parent` is the unit an accessory hangs off
            and that unit's other accessories, tick them with `via: parent`.
            Not required, so an older client keeps working.
          oneOf:
            - $ref: '#/components/schemas/StocktakeConfirmGroup'
            - type: 'null'

    StocktakeConfirmGroup:
      type: object
      required: [kind, name]
      properties:
        kind:
          type: string
          enum: [bundle, parent]
        name:
          type: string
          description: |
            The kit's or the parent unit's name, with its caption and its tag
            where it has them.

    StocktakeBundle:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        tag:
          type: [string, 'null']
        name:
          type: string
          description: The bundle type, with its caption where it has one.

    StocktakeConfirmEntry:
      type: object
      required: [assetId, assetTag, productName, manufacturerName, foundByName]
      properties:
        assetId:
          type: string
        assetTag:
          type: [string, 'null']
        productName:
          type: string
        manufacturerName:
          type: [string, 'null']
        productCaption:
          type: [string, 'null']
          description: |
            The product's caption (see Product.caption), to be shown after the
            product name. Not required, so an older client keeps compiling.
        productImageUrl:
          type: [string, 'null']
          description: |
            The product's picture, absolute like Product.imageUrl — for a
            thumbnail beside the row. Null for a product without one. Not
            required, so an older client keeps compiling.
        foundByName:
          type: [string, 'null']
          description: Counted already, by this person. Null when still to confirm.

    StocktakeTickRequest:
      type: object
      required: [assetIds, locationId, via]
      properties:
        assetIds:
          type: array
          minItems: 1
          items:
            type: string
        locationId:
          type: string
        via:
          type: string
          enum: [manual, parent, bundle]
          description: Why they are ticked without a scan of their own — for the report.

    StocktakeTickResult:
      type: object
      required: [ticked, alreadyFound]
      properties:
        ticked:
          type: integer
        alreadyFound:
          type: integer

    StocktakeNoteRequest:
      type: object
      required: [needsAttention]
      properties:
        note:
          type: [string, 'null']
        needsAttention:
          type: boolean

    StocktakeCountRequest:
      type: object
      required: [productId, locationId, count]
      properties:
        productId:
          type: string
        locationId:
          type: string
        count:
          type: integer
          minimum: 0
        previous:
          type: integer
          minimum: 0
          description: |
            The caller's count here that this one was made from — 0 when there
            was none yet, which is the same thing. When present, the count is
            saved only if the stored one still matches, and otherwise refused
            with `stocktake_count_changed`, so one person counting on two
            devices can't overwrite a number they never saw. Leave it out to
            replace unconditionally.

    CaseKind:
      type: string
      enum: [bundle, asset]
      description: A kit, or one unit with its accessories.

    CaseCheckItem:
      type: object
      required: [assetId, assetTag, serialNumber, orgIndex, name, caption, accessoryOf, awayOn]
      properties:
        assetId:
          type: string
        assetTag:
          type: [string, 'null']
        serialNumber:
          type: [string, 'null']
        orgIndex:
          type: integer
          description: The unit's number within its org, shown as "#123".
        name:
          type: string
          description: Maker and product name.
        caption:
          type: [string, 'null']
        accessoryOf:
          type: [string, 'null']
          description: The unit in this case it hangs off; listed right after it.
        awayOn:
          type: [string, 'null']
          description: |
            The production this unit is checked out to when the rest of the
            case is somewhere else — taken out for another job. Not finding it
            counts as away, not missing.
        innerKit:
          description: |
            The kit inside the case that this unit is in (the adapter set in the
            FOH case). Its units come after the case's own, one kit after
            another, so a client starts a sub-heading whenever it changes.
          oneOf:
            - $ref: '#/components/schemas/KitRef'
            - type: 'null'

    CaseCheck:
      type: object
      required:
        - kind
        - id
        - tag
        - name
        - checkedOutTo
        - items
        - shortOfType
        - lastCheck
        - canRecord
        - scannedAssetId
      properties:
        kind:
          $ref: '#/components/schemas/CaseKind'
        id:
          type: string
          description: The bundle's id, or the unit's.
        tag:
          type: [string, 'null']
          description: The bundle's own tag. Scanning it inside the check ticks nothing.
        name:
          type: string
        checkedOutTo:
          type: [string, 'null']
          description: The production the case as a whole is out on, if any.
        items:
          type: array
          description: |
            What the case should hold, each unit followed by its accessories:
            the case's own units first, then those of each kit inside it.
          items:
            $ref: '#/components/schemas/CaseCheckItem'
        shortOfType:
          type: array
          description: |
            Kits only: products (and kits inside, by type) other cases of the
            same kit type hold more of.
            A unit taken out of the kit for good is no longer on the list, so
            this is the only place it shows.
          items:
            type: object
            required: [name, missing]
            properties:
              name:
                type: string
              missing:
                type: integer
        lastCheck:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/CaseCheckLast'
        canRecord:
          type: boolean
          description: Whether the caller may record the check. Anyone who sees the units may run one.
        scannedAssetId:
          type: [string, 'null']
          description: The unit the code was on, to count as found. Null for a bundle tag.

    CaseCheckLast:
      type: object
      required: [at, userName, found, expected]
      properties:
        at:
          type: string
          format: date-time
        userName:
          type: string
        found:
          type: integer
        expected:
          type: integer

    CaseCheckRequest:
      type: object
      required: [kind, id, foundAssetIds]
      properties:
        kind:
          $ref: '#/components/schemas/CaseKind'
        id:
          type: string
        foundAssetIds:
          type: array
          items:
            type: string

    CaseCheckScanRequest:
      type: object
      required: [code, foundAssetIds]
      properties:
        code:
          type: string
          minLength: 1
        foundAssetIds:
          type: array
          description: The units ticked so far; none of them is swapped away.
          items:
            type: string

    CaseCheckScanResult:
      type: object
      required: [outcome, assetId, name, swap, check]
      properties:
        outcome:
          type: string
          enum: [found, swapped, foreign]
        assetId:
          type: [string, 'null']
          description: '`found` and `swapped`: the unit to tick.'
        name:
          type: [string, 'null']
          description: '`foreign`: what the code is, if known and visible to the caller.'
        swap:
          description: '`swapped`: what changed places.'
          oneOf:
            - $ref: '#/components/schemas/ScanSwap'
            - type: 'null'
        check:
          description: '`swapped`: the case as it is now, with the scanned unit in it.'
          oneOf:
            - $ref: '#/components/schemas/CaseCheck'
            - type: 'null'

    CaseCheckResult:
      type: object
      required: [found, missing, away]
      properties:
        found:
          type: integer
        missing:
          type: integer
        away:
          type: integer
          description: Not found, but checked out to another production.

    CaseLabelSize:
      type: string
      enum: [large, small]
      default: large
      description: '`large` is 4×6″ (101.6 × 152.4 mm), `small` 80 × 55 mm.'

    CaseLabel:
      type: object
      required: [size, zpl, labelCount, widthMm, heightMm, dpmm, previewUrl]
      properties:
        size:
          $ref: '#/components/schemas/CaseLabelSize'
        zpl:
          type: string
          description: |
            One `^XA` … `^XZ` per label, UTF-8 (`^CI28`). A contents list too
            long for one large label continues on the next; the title is only
            on the first, the footer with the code only on the last.
        labelCount:
          type: integer
          minimum: 1
          description: How many labels `zpl` prints — what a preview has to render.
        widthMm:
          type: number
          description: Across the print head.
        heightMm:
          type: number
        dpmm:
          type: integer
          description: Dots per millimetre the label was laid out for (8 = 203 dpi).
        previewUrl:
          type: string
          description: |
            The same label in Labelary's online viewer. The ZPL is in the URL,
            so opening it sends the label's text to labelary.com.

    ProductionCheckStartRequest:
      type: object
      properties:
        organizationId:
          type: string
          description: Which side to check as, for a caller on both.

    ProductionCheckSide:
      type: object
      required: [organizationId, organizationName, own]
      properties:
        organizationId:
          type: string
        organizationName:
          type: string
        own:
          type: boolean
          description: The production's own org — the whole list, and the handover steps.

    ProductionCheckTick:
      type: object
      required: [userName, mine, via, at]
      properties:
        userName:
          type: string
        mine:
          type: boolean
          description: Ticked by the caller, who alone may untick it.
        via:
          type: string
          enum: [scan, manual]
        at:
          type: string
          format: date-time

    ProductionCheckItem:
      type: object
      required:
        - assetId
        - assetTag
        - productName
        - productCaption
        - manufacturerName
        - lentBy
        - accessoryOf
        - group
        - status
        - received
        - returnReported
        - tick
      properties:
        ownerOrgId:
          type: string
          description: |
            The organization the unit belongs to. With `lengthCm`, what the
            cable colour is read off (see `GET /api/v1/cable-colors`). Not
            required, so an older client keeps compiling.
        lengthCm:
          type: [integer, 'null']
          description: The product's length in whole centimetres; null when it has none.
        assetId:
          type: string
        assetTag:
          type: [string, 'null']
        productName:
          type: string
        productCaption:
          type: [string, 'null']
        manufacturerName:
          type: [string, 'null']
        productImageUrl:
          type: [string, 'null']
          description: |
            The product's picture, absolute like Product.imageUrl — for a
            thumbnail beside the row. Null for a product without one. Not
            required, so an older client keeps compiling.
        lentBy:
          type: [string, 'null']
          description: The org that lent the unit; null for the production's own.
        accessoryOf:
          type: [string, 'null']
          description: The unit it hangs off; listed right after it.
        group:
          $ref: '#/components/schemas/ProductionCheckGroup'
        kit:
          description: Not required, so an older client keeps compiling.
          oneOf:
            - $ref: '#/components/schemas/ListKit'
            - type: 'null'
        packCase:
          description: |
            The pack case the unit is listed under: the one it travels in, or
            for a case itself (`isPackCase`), its own. A client lists a section
            per case first — a case inside another right after it, `path`
            saying how far in — the case's own row on top, and everything with
            no case after them under "loose", in the sections it always had.
            Not required, so an older client keeps compiling.
          oneOf:
            - $ref: '#/components/schemas/PackCase'
            - type: 'null'
        isPackCase:
          type: boolean
          description: |
            A pack case: its product is a container (`CatalogProduct.isContainer`)
            and it is in no bundle.
            Not required, so an older client keeps compiling.
        status:
          type: string
          enum: [APPROVED, CHECKED_OUT]
          description: APPROVED is booked but not handed over yet.
        received:
          type: boolean
          description: Lent units only — the production confirmed having it.
        returnReported:
          type: boolean
          description: Lent units only — the production reported it as sent back.
        tick:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ProductionCheckTick'

    ProductionCheckGroup:
      type: object
      required: [kind, name]
      description: |
        The section a unit is listed under. Items arrive sorted by it, so a
        client starts a new heading whenever it changes. `location`: the shelf
        it is kept on. `lender`: lent units, one section per lending org
        (`name` is the org). `none`: no location, `name` is null. An accessory
        is always in its parent's section.
      properties:
        kind:
          type: string
          enum: [location, lender, none]
        name:
          type: [string, 'null']

    ProductionCheckUnexpected:
      type: object
      required: [assetId, assetTag, productName, userName, mine]
      properties:
        assetId:
          type: string
        assetTag:
          type: [string, 'null']
        productName:
          type: string
        userName:
          type: string
        mine:
          type: boolean

    ProductionCheck:
      type: object
      required:
        - id
        - status
        - productionId
        - productionName
        - side
        - createdAt
        - createdBy
        - closedAt
        - closedBy
        - items
        - unexpected
        - canConfirmReceipt
        - canReportReturn
      properties:
        id:
          type: string
        status:
          type: string
          enum: [OPEN, CLOSED]
        productionId:
          type: string
        productionName:
          type: string
        side:
          $ref: '#/components/schemas/ProductionCheckSide'
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        closedAt:
          type: [string, 'null']
          format: date-time
        closedBy:
          type: [string, 'null']
        items:
          type: array
          description: The list as it is now, by section, each unit followed by its accessories.
          items:
            $ref: '#/components/schemas/ProductionCheckItem'
        lines:
          type: array
          description: |
            Interchangeable units without a tag, one counted line per product,
            location and owner. Their units are in `items` as well; a client
            that shows the lines leaves those out of the per-unit rows. Absent
            from servers older than counted lines.
          items:
            $ref: '#/components/schemas/ProductionListLine'
        unexpected:
          type: array
          description: Ticked but not on the list.
          items:
            $ref: '#/components/schemas/ProductionCheckUnexpected'
        canConfirmReceipt:
          type: integer
          description: How many units `receipt` would confirm for the caller — 0 hides it.
        canReportReturn:
          type: integer
          description: How many units `return-report` would report for the caller — 0 hides it.

    ProductionCheckScanRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string

    ProductionCheckScanResult:
      type: object
      required: [result, assetTag, productName, ticked]
      properties:
        result:
          type: string
          enum: [ticked, already, unexpected]
        assetTag:
          type: string
        productName:
          type: string
        ticked:
          type: integer
          description: Units this scan ticked — the unit and its untagged accessories.
        group:
          description: |
            The rest of the scanned unit's kit on this list (kind `bundle`), to
            offer ticking along; `done` is whether it is ticked already. Not
            required, so an older client keeps working.
          oneOf:
            - $ref: '#/components/schemas/ScanGroup'
            - type: 'null'
        kit:
          description: |
            Set when the code was a kit's sticker: its units on this list were
            ticked, accessories along, and `productName`/`assetTag` are the kit's.
            `units` are the ones this scan ticked, to ask about. `unexpected`
            with no units: none of the kit is on this list. Not required, so an
            older client keeps working.
          oneOf:
            - $ref: '#/components/schemas/ScanKit'
            - type: 'null'

    ProductionCheckTickRequest:
      type: object
      required: [assetIds]
      properties:
        assetIds:
          type: array
          items:
            type: string

    ProductionCheckTickResult:
      type: object
      required: [ticked]
      properties:
        ticked:
          type: integer

    ProductionCheckCloseResult:
      type: object
      required: [found, missing]
      properties:
        found:
          type: integer
        missing:
          type: integer

    HandoverResult:
      type: object
      required: [count]
      properties:
        count:
          type: integer

    ProductionListLine:
      type: object
      required:
        - key
        - productName
        - productCaption
        - manufacturerName
        - lentBy
        - group
        - assetIds
        - total
        - done
        - floor
      properties:
        ownerOrgId:
          type: string
          description: |
            The organization the unit belongs to. With `lengthCm`, what the
            cable colour is read off (see `GET /api/v1/cable-colors`). Not
            required, so an older client keeps compiling.
        lengthCm:
          type: [integer, 'null']
          description: The product's length in whole centimetres; null when it has none.
        key:
          type: string
          description: Identifies the line for a count; opaque to clients.
        productName:
          type: string
        productCaption:
          type: [string, 'null']
        manufacturerName:
          type: [string, 'null']
        productImageUrl:
          type: [string, 'null']
          description: |
            The product's picture, absolute like Product.imageUrl — for a
            thumbnail beside the row. Null for a product without one. Not
            required, so an older client keeps compiling.
        lentBy:
          type: [string, 'null']
        group:
          $ref: '#/components/schemas/ProductionCheckGroup'
        assetIds:
          type: array
          items:
            type: string
        total:
          type: integer
        done:
          type: integer
        floor:
          type: integer
          description: The lowest count the caller can set — what others ticked stays.
        packCase:
          description: |
            The pack case these units are in. A line splits when only some of
            its units go into a case: those are a line of their own under it.
            Not required, so an older client keeps compiling.
          oneOf:
            - $ref: '#/components/schemas/PackCase'
            - type: 'null'

    ProductionListLineCount:
      type: object
      required: [key, count]
      properties:
        key:
          type: string
        count:
          type: integer
          minimum: 0

    ProductionListLineResult:
      type: object
      required: [done]
      properties:
        done:
          type: integer

    HandoutMode:
      type: string
      enum: [checkout, checkin]
      description: '`checkout` hands out, `checkin` takes back.'

    ProductionHandoutItem:
      type: object
      required:
        - assetId
        - assetTag
        - productName
        - productCaption
        - manufacturerName
        - lentBy
        - accessoryOf
        - group
        - status
        - done
        - received
        - returnReported
      properties:
        ownerOrgId:
          type: string
          description: |
            The organization the unit belongs to. With `lengthCm`, what the
            cable colour is read off (see `GET /api/v1/cable-colors`). Not
            required, so an older client keeps compiling.
        lengthCm:
          type: [integer, 'null']
          description: The product's length in whole centimetres; null when it has none.
        assetId:
          type: string
        assetTag:
          type: [string, 'null']
        productName:
          type: string
        productCaption:
          type: [string, 'null']
        manufacturerName:
          type: [string, 'null']
        productImageUrl:
          type: [string, 'null']
          description: |
            The product's picture, absolute like Product.imageUrl — for a
            thumbnail beside the row. Null for a product without one. Not
            required, so an older client keeps compiling.
        lentBy:
          type: [string, 'null']
        accessoryOf:
          type: [string, 'null']
        group:
          $ref: '#/components/schemas/ProductionCheckGroup'
        kit:
          description: Not required, so an older client keeps compiling.
          oneOf:
            - $ref: '#/components/schemas/ListKit'
            - type: 'null'
        kitAddition:
          type: boolean
          description: |
            Not booked yet: put into a kit after the kit was booked, and listed
            with it. A tick books it and hands it out at once. Not required, so
            an older client keeps compiling.
        packCase:
          description: |
            The pack case the unit is listed under: the one it travels in, or
            for a case itself (`isPackCase`), its own. A client lists a section
            per case first — a case inside another right after it, `path`
            saying how far in — the case's own row on top, and everything with
            no case after them under "loose", in the sections it always had.
            Not required, so an older client keeps compiling.
          oneOf:
            - $ref: '#/components/schemas/PackCase'
            - type: 'null'
        isPackCase:
          type: boolean
          description: |
            A pack case: its product is a container (`CatalogProduct.isContainer`)
            and it is in no bundle.
            Not required, so an older client keeps compiling.
        status:
          type: string
          enum: [APPROVED, CHECKED_OUT, RETURNED]
          description: |
            RETURNED on the `checkout` list: taken back while the production
            still runs — not owed, but a tick sends it out again.
        done:
          type: boolean
          description: Out (`checkout`) or back (`checkin`).
        received:
          type: boolean
        returnReported:
          type: boolean
        inspectionOverdue:
          type: boolean
          description: |
            Some inspection of the unit is overdue. Handing it out still works;
            say so. Not required, so an older client keeps compiling.

    ProductionHandout:
      type: object
      required:
        - mode
        - productionId
        - productionName
        - cancelled
        - side
        - sides
        - items
        - lines
        - othersCount
      properties:
        mode:
          $ref: '#/components/schemas/HandoutMode'
        productionId:
          type: string
        productionName:
          type: string
        cancelled:
          type: boolean
          description: Nothing more goes out to a cancelled production; taking back still works.
        side:
          $ref: '#/components/schemas/ProductionCheckSide'
        sides:
          type: array
          description: Every side the caller could see the list from; more than one offers a choice.
          items:
            $ref: '#/components/schemas/ProductionCheckSide'
        items:
          type: array
          description: By section, each unit followed by its accessories.
          items:
            $ref: '#/components/schemas/ProductionHandoutItem'
        lines:
          type: array
          description: As in `ProductionCheck.lines`.
          items:
            $ref: '#/components/schemas/ProductionListLine'
        othersCount:
          type: integer
          description: Units in this step that other orgs book themselves.

    ProductionHandoutTickRequest:
      type: object
      required: [assetIds, done]
      properties:
        assetIds:
          type: array
          items:
            type: string
        done:
          type: boolean

    HandoutAddition:
      type: object
      required:
        [
          key,
          productId,
          organizationId,
          locationId,
          productName,
          productCaption,
          productImageUrl,
          manufacturerName,
          locationName,
          organizationName,
          available,
          untagged
        ]
      properties:
        key:
          type: string
        productId:
          type: string
        organizationId:
          type: string
          description: The units' owner.
        locationId:
          type: string
        productName:
          type: string
        productCaption:
          type: [string, 'null']
        productImageUrl:
          type: [string, 'null']
        manufacturerName:
          type: [string, 'null']
        locationName:
          type: string
        organizationName:
          type: string
        available:
          type: integer
          description: Free for the production's dates, not out anywhere, not on it already.
        untagged:
          type: integer
          description: Of those, how many carry no tag.

    HandoutAdditionRequest:
      type: object
      required: [productId, ownerId, locationId, count]
      properties:
        organizationId:
          type: string
          description: The side, as on the hand-out list.
        productId:
          type: string
        ownerId:
          type: string
          description: '`organizationId` of the chosen group.'
        locationId:
          type: string
        count:
          type: integer
          minimum: 1

    CountResult:
      type: object
      required: [count]
      properties:
        count:
          type: integer

    BundleSummary:
      type: object
      required:
        [
          id,
          name,
          caption,
          tag,
          imageUrl,
          categoryName,
          organizationId,
          location,
          unitCount,
          parentBundle
        ]
      properties:
        id:
          type: string
        name:
          type: string
          description: The bundle type's name.
        caption:
          type: [string, 'null']
        tag:
          type: [string, 'null']
        imageUrl:
          type: [string, 'null']
        categoryName:
          type: string
        organizationId:
          type: string
        location:
          description: The kit's own location; null for one that is wherever its units are.
          oneOf:
            - $ref: '#/components/schemas/LocationRef'
            - type: 'null'
        unitCount:
          type: integer
          description: Units in it, not counting accessories or the units of kits inside it.
        parentBundle:
          description: The kit this one sits inside, if any. Kits nest one level deep.
          oneOf:
            - $ref: '#/components/schemas/KitRef'
            - type: 'null'

    KitRef:
      type: object
      required: [id, name, tag]
      description: A kit, named for a heading or a link.
      properties:
        id:
          type: string
        name:
          type: string
          description: The kit's name with its caption.
        tag:
          type: [string, 'null']

    InnerBundle:
      type: object
      required: [id, name, caption, tag, imageUrl, unitCount]
      description: A kit that sits inside another one.
      properties:
        id:
          type: string
        name:
          type: string
          description: The bundle type's name.
        caption:
          type: [string, 'null']
        tag:
          type: [string, 'null']
        imageUrl:
          type: [string, 'null']
        unitCount:
          type: integer
          description: Units in it, not counting accessories.

    LocationRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string

    BundleUnit:
      type: object
      required:
        [
          id,
          assetTag,
          serialNumber,
          orgIndex,
          status,
          parentAssetId,
          productId,
          productName,
          productCaption,
          manufacturerName,
          productImageUrl,
          location,
          checkedOutTo
        ]
      properties:
        lengthCm:
          type: [integer, 'null']
          description: |
            The product's length in whole centimetres, null when it has none —
            with the kit's organization, what the cable colour is read off (see
            `GET /api/v1/cable-colors`). Not required, so an older client keeps compiling.
        id:
          type: string
        assetTag:
          type: [string, 'null']
        serialNumber:
          type: [string, 'null']
        orgIndex:
          type: integer
        status:
          type: string
        parentAssetId:
          type: [string, 'null']
          description: Set on an accessory; it follows the unit with this id.
        productId:
          type: string
        productName:
          type: string
        productCaption:
          type: [string, 'null']
        manufacturerName:
          type: [string, 'null']
        productImageUrl:
          type: [string, 'null']
        location:
          $ref: '#/components/schemas/LocationRef'
        checkedOutTo:
          type: [string, 'null']
          description: The production it is out on, if any.

    BundleDetail:
      allOf:
        - $ref: '#/components/schemas/BundleSummary'
        - type: object
          required: [units, innerBundles, canEdit]
          properties:
            units:
              type: array
              description: |
                Each unit followed by its accessories, by product name. The
                units of kits inside it are theirs, not listed here.
              items:
                $ref: '#/components/schemas/BundleUnit'
            innerBundles:
              type: array
              description: The kits that sit inside this one, by name.
              items:
                $ref: '#/components/schemas/InnerBundle'
            canEdit:
              type: boolean
              description: Whether the caller may change what it holds (ADMIN or above).
            caseUnitId:
              type: [string, 'null']
              description: |
                The unit that is the kit's case: the container in it
                (`CatalogProduct.isContainer`), the lowest-numbered of two.
                Scanning its tag means the whole kit, as the kit's own tag
                does. Not required, so an older client keeps compiling.
            number:
              type: [string, 'null']
              description: |
                The kit's number: its own `tag`, else its case's tag, else
                null (a DMX ring). What its label prints. Not required, so an
                older client keeps compiling.
            numberFromCase:
              type: boolean
              description: |
                `number` is the case's tag — show it as the kit's number. Not
                required, so an older client keeps compiling.
            extraCases:
              type: integer
              description: |
                More containers in it besides its case; only the lowest unit
                number counts. Worth a hint. Not required, so an older client
                keeps compiling.

    BundleCreateRequest:
      type: object
      required: [organizationId, name, categoryId]
      properties:
        organizationId:
          type: string
        name:
          type: string
          minLength: 1
        categoryId:
          type: string
        caption:
          type: string
        tag:
          type: string
          description: The sticker on the case. Unique, and not a unit's tag.

    BundleScanRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
        moveFromOtherBundle:
          type: boolean
          description: The user agreed to take the unit (or kit) out of the kit it is in.

    BundleScanOutcome:
      type: string
      enum: [added, already_in, in_other_bundle, not_found, ambiguous, is_bundle]
      description: |
        `is_bundle` is no longer sent: a bundle's tag now puts that bundle
        inside (`scannedBundle`). It stays in the list for older clients.

    BundleScanResult:
      type: object
      required: [outcome, bundle]
      properties:
        outcome:
          $ref: '#/components/schemas/BundleScanOutcome'
        assetId:
          type: [string, 'null']
          description: The unit that went in (or already was). Null for a kit.
        scannedBundle:
          description: When the code was another kit's tag, that kit.
          oneOf:
            - $ref: '#/components/schemas/LocationRef'
            - type: 'null'
        otherBundle:
          description: With `in_other_bundle`, the kit the unit (or scanned kit) is in now.
          oneOf:
            - $ref: '#/components/schemas/LocationRef'
            - type: 'null'
        bundle:
          $ref: '#/components/schemas/BundleDetail'

    LooseGroup:
      type: object
      required:
        [
          key,
          productId,
          locationId,
          productName,
          productCaption,
          productImageUrl,
          manufacturerName,
          locationName,
          available,
          untagged
        ]
      properties:
        key:
          type: string
        productId:
          type: string
        locationId:
          type: string
        productName:
          type: string
        productCaption:
          type: [string, 'null']
        productImageUrl:
          type: [string, 'null']
        manufacturerName:
          type: [string, 'null']
        locationName:
          type: string
        available:
          type: integer
        untagged:
          type: integer

    LooseAddRequest:
      type: object
      required: [productId, locationId, count]
      properties:
        productId:
          type: string
        locationId:
          type: string
        count:
          type: integer
          minimum: 1

    LooseAddResult:
      type: object
      required: [count, bundle]
      properties:
        count:
          type: integer
        bundle:
          $ref: '#/components/schemas/BundleDetail'

    ProductCreateRequest:
      type: object
      required: [organizationId, name, categoryId]
      properties:
        organizationId:
          type: string
          description: The org the units will be for; the right to add is checked there.
        name:
          type: string
          minLength: 1
        manufacturerName:
          type: string
          description: Found by name, or made. Absent or blank - no manufacturer.
        categoryId:
          type: string
        caption:
          type: string

    UntaggedAssetsRequest:
      type: object
      required: [organizationId, locationId, productId, count]
      properties:
        organizationId:
          type: string
        locationId:
          type: string
        productId:
          type: string
        count:
          type: integer
          minimum: 1
          maximum: 200
        bundleId:
          type: string

    AssetCreateResult:
      type: object
      required: [assets]
      properties:
        assets:
          type: array
          items:
            $ref: '#/components/schemas/Asset'

    InventoryProduct:
      type: object
      required: [product, organizationId, organizationName, count, available, untagged]
      properties:
        product:
          $ref: '#/components/schemas/Product'
        organizationId:
          type: string
        organizationName:
          type: string
          description: The org's short name, else its name.
        count:
          type: integer
          description: Active units after the filters.
        available:
          type: integer
          description: Of those, how many are AVAILABLE.
        untagged:
          type: integer
          description: Of those, how many carry no tag.
