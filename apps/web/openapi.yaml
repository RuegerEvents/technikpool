openapi: 3.1.0

info:
  title: Technikpool API
  version: 1.0.0
  description: |
    Read and scan access to Technikpool inventory for external clients — chiefly
    the Flutter app running on warehouse PDA scanners.

    This document is the contract. Server response types are generated from it
    (`pnpm openapi:types`) and so is the Dart client (`dart run swagger_parser`),
    so an endpoint that drifts from this file fails the build rather than the
    device.

    ## Authentication

    Every /api/v1 operation needs `Authorization: Bearer <session token>`.
    A token is obtained in one of two ways, both documented below:

    1. **Device authorization grant** (preferred for shared devices). POST
       /api/auth/device/code, show the returned `user_code` to the operator,
       and poll POST /api/auth/device/token until it stops answering
       `authorization_pending`. Meanwhile a signed-in user approves the code in
       a browser. Respect `interval`: polling faster earns `slow_down`.
    2. **Password sign-in.** POST /api/auth/sign-in/email. The token comes back
       in the `set-auth-token` *response header*, not the body.

    Reads are scoped to the organizations the authenticated user belongs to.
    System admins see everything.

servers:
  - url: /
    description: Same origin as the app

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Obtaining a session token. Not under /api/v1 — these are better-auth routes.
  - name: identity
    description: Who the caller is and what they can see.
  - name: inventory
    description: Reading locations, productions and assets.
  - name: scanning
    description: Booking scanned assets in and out.

paths:
  /api/auth/device/code:
    post:
      operationId: requestDeviceCode
      tags: [auth]
      summary: Start the device authorization flow
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCodeRequest'
      responses:
        '200':
          description: Device and user codes issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCodeResponse'
        '400':
          $ref: '#/components/responses/OAuthError'

  /api/auth/device/token:
    post:
      operationId: pollDeviceToken
      tags: [auth]
      summary: Exchange an approved device code for a session token
      description: |
        Poll no faster than the `interval` from the code response. Until the
        user approves, this answers 400 with `error: authorization_pending`;
        polling too fast answers `slow_down`; an expired code answers
        `expired_token`; a denied one `access_denied`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTokenRequest'
      responses:
        '200':
          description: Session token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTokenResponse'
        '400':
          $ref: '#/components/responses/OAuthError'

  /api/auth/device/approve:
    post:
      operationId: approveDeviceCode
      tags: [auth]
      summary: Approve a pending device code (browser, signed in)
      description: |
        Requires a signed-in session cookie, and the session must already have
        claimed the code via `GET /api/auth/device?user_code=...`. Used by the
        web UI, not by the device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userCode]
              properties:
                userCode:
                  type: string
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          $ref: '#/components/responses/OAuthError'

  /api/auth/sign-in/email:
    post:
      operationId: signInWithEmail
      tags: [auth]
      summary: Sign in with email and password
      description: |
        The session token is returned in the `set-auth-token` response header.
        Native clients must read it from there.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Signed in
          headers:
            set-auth-token:
              description: The session token to use as a bearer credential.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/me:
    get:
      operationId: getCurrentUser
      tags: [identity]
      summary: The authenticated user and their organizations
      description: |
        Also the cheapest way for a client to check whether its stored token is
        still valid — a 401 here means unpair and sign in again.
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/locations:
    get:
      operationId: listLocations
      tags: [inventory]
      summary: Locations across the user's organizations
      responses:
        '200':
          description: Locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/productions:
    get:
      operationId: listProductions
      tags: [inventory]
      summary: Productions across the user's organizations
      description: |
        Cancelled productions are left out: nothing can be checked out to one,
        so it is never a scan target. Units still out on a cancelled production
        come back by scanning them onto a location, as always.
      responses:
        '200':
          description: Productions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Production'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/categories:
    get:
      operationId: listCategories
      tags: [inventory]
      summary: Product categories
      description: |
        Global rather than per-organization: a category is a kind of equipment,
        and two orgs lending each other a moving light agree on what it is.
      responses:
        '200':
          description: Categories, already in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/assets:
    get:
      operationId: listAssets
      tags: [inventory]
      summary: Browse assets
      description: |
        Sold and decommissioned assets are left out — this is the pool that can
        still be worked with. Look one up by tag to see a retired unit.
      parameters:
        - name: locationId
          in: query
          description: Only assets currently at this location.
          schema:
            type: string
        - name: productionId
          in: query
          description: >-
            Only assets booked to this production. Listing a production's kit is
            a read of that production, so a caller who may not open it is
            refused (`403`) rather than handed an empty page, and an id that
            names nothing answers `404 production_not_found`.
          schema:
            type: string
        - name: categoryId
          in: query
          description: Only assets whose product is in this category.
          schema:
            type: string
        - name: q
          in: query
          description: Case-insensitive match on asset tag, serial number, product or manufacturer name.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: The `nextCursor` from a previous page.
          schema:
            type: string
      responses:
        '200':
          description: A page of assets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/assets/by-tag/{tag}:
    get:
      operationId: getAssetByTag
      tags: [inventory]
      summary: Look up one asset by its printed tag or serial number
      description: |
        The asset tag is unique and always wins. Failing that the code is
        matched, case-insensitively, against serial numbers among the assets
        the caller can already see — and only resolves when exactly one unit
        carries it. Two units sharing a serial answer `409 serial_ambiguous`
        rather than guessing between them.
      parameters:
        - name: tag
          in: path
          required: true
          description: |
            The asset tag as encoded in the sticker's barcode, or a serial
            number that belongs to exactly one unit.
          schema:
            type: string
      responses:
        '200':
          description: The asset, with recent history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/scans:
    post:
      operationId: createScan
      tags: [scanning]
      summary: Book a scanned asset to a location or production
      description: |
        Assigning an asset to a location also returns it from any production it
        is currently checked out to — putting kit back on the shelf is what
        "returned" means in practice.

        `assetTag` also accepts a serial number, on the same terms as
        `getAssetByTag`: the printed tag wins, and a serial resolves only when
        exactly one visible unit carries it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanRequest'
      responses:
        '200':
          description: The asset was booked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A better-auth session token.

  responses:
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, expired or invalid token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The record exists but belongs to another organization.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: |
        The record exists but its state forbids the operation — a sold or
        decommissioned asset can no longer be booked (`asset_retired`), and a
        unit held back as unavailable cannot be checked out
        (`asset_unavailable`), and nothing is checked out to a production that
        has been cancelled (`production_cancelled`). A code that matched more
        than one unit's serial number identifies nothing in particular
        (`serial_ambiguous`) — the asset tag is what disambiguates it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: >-
        No such record — or, for a filter that names one, no such record the
        caller could have named (`production_not_found`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    OAuthError:
      description: An RFC 8628 error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthError'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable identifier.
              examples:
                [
                  unauthorized,
                  asset_not_found,
                  forbidden,
                  asset_retired,
                  asset_unavailable,
                  production_cancelled
                ]
            message:
              type: string
              description: Human-readable text, safe to show to the operator.

    OAuthError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
            - authorization_pending
            - slow_down
            - access_denied
            - expired_token
            - invalid_request
            - invalid_grant
        error_description:
          type: string

    DeviceCodeRequest:
      type: object
      required: [client_id]
      properties:
        client_id:
          type: string
          examples: [technikpool-scanner]
        scope:
          type: string

    DeviceCodeResponse:
      type: object
      required: [device_code, user_code, verification_uri, expires_in, interval]
      properties:
        device_code:
          type: string
          description: Secret. Sent when polling; never shown to the user.
        user_code:
          type: string
          description: Short code shown on the device for a human to type.
          examples: [W8CSZRHS]
        verification_uri:
          type: string
        verification_uri_complete:
          type: string
          description: verification_uri with the user code pre-filled.
        expires_in:
          type: integer
          description: Seconds until the device code expires.
        interval:
          type: integer
          description: Minimum seconds between polls.

    DeviceTokenRequest:
      type: object
      required: [grant_type, device_code, client_id]
      properties:
        grant_type:
          type: string
          # A single-value enum here generates an unusable identifier in Dart
          # (the URN can't be one), so this stays a documented constant string.
          description: Always `urn:ietf:params:oauth:grant-type:device_code`.
          examples: ['urn:ietf:params:oauth:grant-type:device_code']
        device_code:
          type: string
        client_id:
          type: string

    DeviceTokenResponse:
      type: object
      required: [access_token, token_type]
      properties:
        access_token:
          type: string
          description: A better-auth session token. Use as the bearer credential.
        token_type:
          type: string
          examples: [Bearer]
        expires_in:
          type: integer
        scope:
          type: string

    SignInResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        redirect:
          type: boolean

    User:
      type: object
      required: [id, email, emailVerified]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: [string, 'null']
        emailVerified:
          type: boolean
        image:
          type: [string, 'null']

    Organization:
      type: object
      required: [id, name, color, avatarLabel]
      properties:
        id:
          type: string
        name:
          type: string
        shortName:
          type: [string, 'null']
          description: Abbreviation to prefer wherever space is tight.
        color:
          type: string
          description: Hex colour for the org badge.
        avatarLabel:
          type: string

    CurrentUser:
      type: object
      required: [user, isAdmin, organizations]
      properties:
        user:
          $ref: '#/components/schemas/User'
        isAdmin:
          type: boolean
          description: System-level admin, sees every organization.
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/MemberOrganization'

    MemberOrganization:
      type: object
      description: >-
        An organization the caller belongs to, and the rung they stand on in it.
        Spelled out rather than composed from Organization because only this
        response carries a role: an organization named by an asset or a
        production is a label, not a statement about the caller.
      required: [id, name, color, avatarLabel]
      properties:
        id:
          type: string
        name:
          type: string
        shortName:
          type: [string, 'null']
          description: Abbreviation to prefer wherever space is tight.
        color:
          type: string
          description: Hex colour for the org badge.
        avatarLabel:
          type: string
        role:
          type: string
          enum: [DEVICE_VIEWER, VIEWER, MEMBER, ADMIN, OWNER]
          description: >-
            What the caller may do here, as a ladder: each rung can do
            everything below it. DEVICE_VIEWER sees the equipment only —
            booking or returning anything needs MEMBER or above, so a client
            can stop offering a scan that the server will refuse.

            Absent where there is no membership at all, which only happens for
            a system admin: `isAdmin` is what grants them that organization.
            Omitted rather than null so the value stays a plain enum — a null
            member generates an unusable identifier in the Dart client.

    Address:
      type: object
      required: [id, line1, postalCode, city]
      properties:
        id:
          type: string
        line1:
          type: string
        line2:
          type: [string, 'null']
        postalCode:
          type: string
        city:
          type: string

    Location:
      type: object
      required: [id, name, organization]
      properties:
        id:
          type: string
        name:
          type: string
        organization:
          $ref: '#/components/schemas/Organization'
        address:
          oneOf:
            - $ref: '#/components/schemas/Address'
            - type: 'null'

    Production:
      type: object
      required: [id, name, organization]
      properties:
        id:
          type: string
        name:
          type: string
        startDate:
          type: [string, 'null']
          format: date-time
        endDate:
          type: [string, 'null']
          format: date-time
        organization:
          $ref: '#/components/schemas/Organization'

    Asset:
      type: object
      required: [id, status, product, location, organization]
      properties:
        id:
          type: string
        assetTag:
          type: [string, 'null']
          description: The printed tag. Null for assets that have never been labelled.
        serialNumber:
          type: [string, 'null']
        status:
          type: string
          description: |
            `SOLD` and `DECOMMISSIONED` are end of life: the unit has left the
            pool, cannot be booked or scanned onto anything, and is omitted from
            listAssets. getAssetByTag still returns it, so a scan of a retired
            sticker explains itself instead of reading as an unknown tag. Such a
            unit is no longer *at* its `location` — that is where it stood when
            it went.

            `UNAVAILABLE` is held back rather than gone: still in the pool, still
            listed, still scannable onto a location, but a scan that would check
            it out to a production is refused with `asset_unavailable`.
            `MAINTENANCE` and `BROKEN` describe condition only and do not stop a
            checkout.
          enum: [AVAILABLE, UNAVAILABLE, MAINTENANCE, BROKEN, SOLD, DECOMMISSIONED]
        product:
          $ref: '#/components/schemas/Product'
        location:
          $ref: '#/components/schemas/Location'
        organization:
          $ref: '#/components/schemas/Organization'
        bundleId:
          type: [string, 'null']
        parentAssetId:
          type: [string, 'null']
          description: |
            Set when this unit is an accessory of another — its case, its power
            supply, its brackets. An accessory travels with its parent: it is
            booked, moved and returned whenever the parent is, and is never
            picked on its own. Scanning it alone still moves only itself.

    Product:
      type: object
      required: [id, name, manufacturerName, category]
      properties:
        id:
          type: string
        name:
          type: string
        manufacturerName:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        imageUrl:
          type: [string, 'null']
        cable:
          description: |
            Present only for cables. The name already carries type and length;
            this is the structured form, for filtering and for showing the ends
            without parsing a label. Deliberately not required, like
            Location.address: a client that predates it keeps compiling.
          oneOf:
            - $ref: '#/components/schemas/CableSpec'
            - type: 'null'

    CableSpec:
      type: object
      required: [type, connectorA, connectorB, lengthCm, ways]
      properties:
        type:
          type: [string, 'null']
          description: |
            The wire rather than the ends — `CAT7`, `2,5 mm²`, `DMX`. Free text,
            not an enum, and null on most cables: what a lead is, is usually said
            completely by its connectors and its length.
        connectorA:
          type: [string, 'null']
          description: |
            The single pair of an ordinary lead. Null on a loom, which carries
            its ends in `ways` instead — a cable is one or the other, never both.
        connectorB:
          type: [string, 'null']
        lengthCm:
          type: [integer, 'null']
          description: Whole centimetres.
        ways:
          type: array
          description: |
            A loom's ways: two or more pairs of ends running the length of one
            cable. Empty on an ordinary lead.
          items:
            $ref: '#/components/schemas/CableWay'

    CableWay:
      type: object
      required: [count, type, connectorA, connectorB]
      description: |
        One way of a loom. Identical ways are one entry with a count — "6× Schuko
        M→F" is a number, not six entries.
      properties:
        count:
          type: integer
          minimum: 1
        type:
          type: [string, 'null']
          description: This way's wire, where a loom's ways differ — `2,5 mm²`, `CAT7`.
        connectorA:
          type: [string, 'null']
        connectorB:
          type: [string, 'null']

    Category:
      type: object
      required: [id, name, color, sortOrder]
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
          description: |
            Hex, `#rrggbb`. User-chosen and unconstrained, so it runs from white
            to near-black — derive the text colour from its luminance rather
            than assuming a dark background.
        sortOrder:
          type: integer
          description: Ascending, ties broken by name. listCategories applies both.

    AssetDetail:
      allOf:
        - $ref: '#/components/schemas/Asset'
        - type: object
          required: [history, currentProduction]
          properties:
            currentProduction:
              description: >-
                The production this asset is currently checked out to, if any. A
                production of an organization the caller is not a member of is
                still reported — the unit is not free — but its `name` is that
                organization's name, since the caller may not see the production
                itself.
              oneOf:
                - $ref: '#/components/schemas/Production'
                - type: 'null'
            history:
              type: array
              description: Most recent transactions first.
              items:
                $ref: '#/components/schemas/AssetTransaction'

    AssetTransaction:
      type: object
      required: [id, action, createdAt]
      properties:
        id:
          type: string
        action:
          type: string
          examples: [CHECKED_OUT, RETURNED, LOCATION_ASSIGNED]
        createdAt:
          type: string
          format: date-time
        userName:
          type: [string, 'null']
          description: Who performed it. Null if the account has since been removed.
        productionName:
          type: [string, 'null']
          description: >-
            The production involved, if any. For a production of an organization
            the caller is not a member of, that organization's name instead.

    AssetPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
        nextCursor:
          type: [string, 'null']
          description: Pass as `cursor` for the next page. Null on the last page.

    ScanRequest:
      type: object
      required: [assetTag, targetType, targetId]
      properties:
        assetTag:
          type: string
          description: |
            Exactly what the barcode decoded to — an asset tag, or a serial
            number that belongs to exactly one unit.
        targetType:
          type: string
          enum: [location, production]
        targetId:
          type: string

    ScanResult:
      type: object
      required: [asset, action, targetName, returnedFrom]
      properties:
        asset:
          $ref: '#/components/schemas/ScannedAsset'
        action:
          type: string
          enum: [LOCATION_ASSIGNED, CHECKED_OUT]
        targetName:
          type: string
          description: Name of the location or production, for the session log.
        returnedFrom:
          type: array
          description: Productions the asset was automatically returned from.
          items:
            type: string

    ScannedAsset:
      type: object
      required: [id, assetTag, productName, manufacturerName]
      properties:
        id:
          type: string
        assetTag:
          type: string
        productName:
          type: string
        manufacturerName:
          type: string
